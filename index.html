<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>TANNGUYEN-OH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Be+Vietnam+Pro:wght@400;600;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: fixed 3D neon backdrop; title = logo + 3D duel stage + glass menu; game = neon arena board + detail/log column */
:root{
  --bg:#030814; --panel:rgba(10,26,62,.82); --panel2:#132a5c; --line:#245cc0; --fg:#eaf4ff; --mute:#8fb0e0;
  --gold:#ffc83a; --gold2:#ff9a1a; --cy:#28d7ff; --red:#ff4d5e; --green:#3ddc97; --blue:#6aa9ff;
  --display:'Bangers','Impact','Arial Black',sans-serif; --ui:'Chakra Petch','Be Vietnam Pro',system-ui,sans-serif; --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:#030814}
body{background:#030814;color:var(--fg);font-family:var(--body);font-size:14px;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:radial-gradient(900px 600px at 50% -10%,#17428f,#06122e 60%,#030814)}
#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#app{position:relative;z-index:1;padding-inline:16px;padding-block:12px}
.screen{max-width:1100px;margin-inline:auto}
h3.sec{margin:14px 0 8px;font:700 13px var(--ui);letter-spacing:.22em;text-transform:uppercase;color:#9fd8ff}
h3.sec::before{content:'';display:inline-block;width:18px;height:3px;background:linear-gradient(90deg,var(--cy),transparent);vertical-align:middle;margin-right:8px}

/* buttons */
.btn{position:relative;overflow:hidden;padding:10px 16px;font:700 14px var(--ui);letter-spacing:.08em;text-transform:uppercase;border-radius:10px;border:1px solid #3a78e0;background:linear-gradient(#1c428a,#0f2556);color:#fff;box-shadow:0 3px 0 #06122e,inset 0 1px 0 #ffffff33;transition:transform .08s,filter .15s}
.btn::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:skewX(-20deg);transition:left .5s}
.btn:hover:not(:disabled)::after{left:130%}
.btn:hover:not(:disabled){filter:brightness(1.2)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #06122e}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.big{display:block;width:100%;margin-top:14px;padding:12px;font:400 34px var(--display);letter-spacing:.1em;background:linear-gradient(180deg,#ffe27a,#ff9a1a);color:#2b1250;border-color:#fff3b0;box-shadow:0 4px 0 #8a4a00,0 0 24px #ffc83a66}
.btn.ghost{background:rgba(10,30,70,.55)}
.btn.gold{background:linear-gradient(180deg,#ffe27a,#ff9a1a);color:#2b1250;border-color:#fff3b0;box-shadow:0 3px 0 #8a4a00}
.iconbtn{width:42px;height:42px;padding:0;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;fill:currentColor}

/* title */
.tlogo{text-align:center;padding-top:4px}
.logo{display:inline-block;white-space:nowrap;font:400 clamp(30px,10.5vw,108px)/.95 var(--display);letter-spacing:.03em;background:linear-gradient(180deg,#fffbe0 0,#ffd54a 36%,#ff9a1a 68%,#c0460a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #1a0a3a;filter:drop-shadow(0 5px 0 #1a0a3a) drop-shadow(0 0 22px #28d7ff99);transform:skewX(-6deg);animation:logoPulse 4s ease-in-out infinite}
@keyframes logoPulse{50%{filter:drop-shadow(0 5px 0 #1a0a3a) drop-shadow(0 0 34px #ffc83acc)}}
.tag{margin:6px 0 0;font:600 clamp(10px,2.6vw,14px) var(--ui);letter-spacing:.3em;text-transform:uppercase;color:#9fd8ff}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:center;margin-top:6px}
@media(min-width:900px){.tgrid{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px}}
.herostage{position:relative;width:100%}
#heroCv{display:block;width:100%;height:clamp(230px,56vw,300px)}
@media(min-width:900px){#heroCv{height:clamp(300px,34vw,470px)}}
.herostage .vs{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:400 clamp(36px,8vw,70px) var(--display);color:var(--red);text-shadow:0 0 22px #ff4d5e,0 5px 0 #4a0a1a;pointer-events:none}
.hl{position:absolute;bottom:2px;font:700 clamp(10px,2.4vw,14px) var(--ui);letter-spacing:.18em;text-transform:uppercase;padding:4px 10px;border:1px solid #28d7ff88;background:#04163acc;border-radius:6px;color:#cfeaff}
.hl.l{left:4%}.hl.r{right:4%}
@media(max-width:420px){.hl{font-size:9px;letter-spacing:.06em;padding:3px 6px;max-width:46%;text-align:center}.hl.l{left:1%}.hl.r{right:1%}}
#heroFallback{display:flex;justify-content:center;align-items:flex-end;gap:20px}
#heroFallback[hidden]{display:none}
#heroFallback .a{width:clamp(110px,28vw,200px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,#5b3aa8,#1d1536 70%);border:3px solid var(--gold);padding:6px;overflow:hidden}
#heroFallback .vs{position:static;transform:none;align-self:center}
.menu{background:linear-gradient(160deg,rgba(18,48,108,.88),rgba(6,16,42,.92));border:1px solid #2d6fe0aa;border-radius:16px;padding:14px;box-shadow:0 14px 44px #000b,inset 0 0 0 1px #ffffff14;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs{display:flex;gap:6px;background:#04163a;border-radius:10px;padding:4px}
.tabs button{flex:1;padding:9px 6px;border:0;border-radius:8px;background:transparent;font:700 13px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#8fb0e0}
.tabs button.on{background:linear-gradient(#ffe27a,#ff9a1a);color:#2b1250;box-shadow:0 0 14px #ffc83a77}
.decks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.deck{position:relative;display:grid;gap:4px;align-content:start;border:2px solid #245cc088;background:rgba(6,20,52,.8);border-radius:12px;padding:8px;cursor:pointer;text-align:center;transition:transform .12s,border-color .15s}
.deck input{position:absolute;opacity:0;pointer-events:none}
.deck:hover{transform:translateY(-2px)}
.deck .dk-art{aspect-ratio:1;border-radius:8px;background:radial-gradient(circle at 50% 40%,#3a6ad8,#0a1a44 75%);display:grid;place-items:center;overflow:hidden}
.deck .dk-art img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 4px #000a)}
.deck .dk-art span{font-size:44px}
.deck b{font:700 13px/1.15 var(--ui);letter-spacing:.04em}
.deck small{color:var(--mute);font-size:11px;line-height:1.3}
.deck:has(input:checked){border-color:var(--gold);box-shadow:0 0 18px #ffc83a77,inset 0 0 14px #ffc83a22;transform:translateY(-2px)}
.deck:has(input:focus-visible){outline:2px solid var(--gold)}
@media(max-width:420px){.deck small{display:none}}
.seg{display:flex;gap:8px}
.seg label{flex:1;text-align:center;border:2px solid #245cc088;background:rgba(6,20,52,.8);border-radius:10px;padding:9px;cursor:pointer;font:700 13px var(--ui);letter-spacing:.1em;text-transform:uppercase}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--gold);background:linear-gradient(#3a2a08,#1a1204);color:var(--gold);box-shadow:0 0 12px #ffc83a55}
.mini-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini-row .btn{padding:9px 6px;font-size:12px}
.online{display:grid;gap:10px}
.online .hint{margin:0;color:var(--mute);font-size:13px;line-height:1.5}
.online .join{display:flex;gap:8px}
.online input{flex:1;min-width:0;background:#02102c;border:2px solid #245cc0;border-radius:10px;font:700 22px var(--ui);letter-spacing:.35em;text-align:center;padding:8px;text-transform:uppercase}
.online .err{margin:0;color:var(--red);font-size:13px}
.foot{color:var(--mute);font-size:12px;margin:16px 0 4px;text-align:center;line-height:1.5}

/* game */
.hud{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hud .btn{flex:none}
@media(max-width:520px){.mini-logo{font-size:22px}.hud .btn:not(.iconbtn){padding:9px 10px;font-size:12px}}
@media(max-width:400px){.mini-logo{display:none}}
.mini-logo{font:400 28px var(--display);letter-spacing:.05em;background:linear-gradient(#fff3b0,#ff9a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #1a0a3a)}
.sp{flex:1}
#turnInfo{font:700 13px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#cfeaff;border:1px solid #28d7ff88;background:#04163acc;border-radius:999px;padding:5px 12px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
#boardwrap{position:relative;max-width:min(560px,100%);margin-inline:auto}
@supports (width:min(1px,1dvh)){#boardwrap{max-width:min(560px,100%,calc((100dvh - 230px)*.82))}}
@media(max-height:560px){#boardwrap{max-width:min(440px,100%)}}
.ctrl{display:flex;gap:8px;margin:10px auto 0;max-width:560px}
.ctrl .btn{flex:1;padding:11px 8px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.detail{background:linear-gradient(160deg,rgba(18,48,108,.85),rgba(6,16,42,.9));border:1px solid #2d6fe0aa;border-radius:14px;padding:10px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;min-height:150px;font-size:13px;box-shadow:0 8px 24px #0008}
.detail .cw{width:120px;aspect-ratio:59/86}
.detail h3{margin:0 0 2px;font:700 15px var(--ui);letter-spacing:.03em}
.detail .ty{color:var(--gold);font-size:12px;margin-bottom:4px}
.detail p{margin:0;line-height:1.5}
.detail .empty{grid-column:1/-1;color:var(--mute);align-self:center;text-align:center}
.log{background:linear-gradient(160deg,rgba(14,36,84,.8),rgba(6,16,42,.88));border:1px solid #2d6fe088;border-radius:14px;padding:8px 12px;height:220px;overflow-y:auto;font-size:12px;line-height:1.55;color:var(--mute)}
.log div:last-child{color:var(--fg)}
.log .h{color:var(--gold);font-weight:600}
@media(max-width:900px){.log{height:150px}}
.hand{display:flex;gap:6px;overflow-x:auto;max-width:560px;margin:10px auto 0;padding:10px 4px 10px;min-height:70px;scrollbar-width:thin}
.hc{flex:none;width:clamp(68px,17vw,100px);aspect-ratio:59/86;cursor:pointer;transition:transform .14s,filter .14s}
.hc:hover{transform:translateY(-10px);filter:drop-shadow(0 0 10px #ffc83acc)}
#board{display:flex;flex-direction:column;gap:4px;padding:10px 8px;border:2px solid var(--cy);border-radius:16px;box-shadow:0 0 0 1px #0a2a5a,0 0 30px #28d7ff55,0 20px 40px #000a,inset 0 0 50px #0b3a8a88;background:radial-gradient(ellipse at 50% 50%,#28d7ff26 0,transparent 65%),repeating-linear-gradient(0deg,#28d7ff1c 0 1px,transparent 1px 30px),repeating-linear-gradient(90deg,#28d7ff1c 0 1px,transparent 1px 30px),linear-gradient(rgba(6,33,77,.86),rgba(3,12,36,.92))}
.row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.row.r1{transform:scale(.86)}.row.r2{transform:scale(.91)}.row.r3{transform:scale(.96)}
.cell{aspect-ratio:59/86;border:1.5px solid #28d7ffaa;background:linear-gradient(160deg,#28d7ff22,#0b3a8a22);box-shadow:inset 0 0 10px #28d7ff44,0 0 8px #28d7ff33;border-radius:5px;position:relative;min-width:0}
.cell[data-zone]{cursor:pointer}
.cell.empty.mz{background:linear-gradient(160deg,#28d7ff14,transparent)}
.cell.ghost{border:none;background:none;box-shadow:none}
.cell.fieldz{border-color:#12e0b888}
.cell.pile{display:grid;place-content:center;text-align:center;font-size:11px;color:var(--mute);border-color:#28d7ff66;background:#05143299;cursor:default}
.cell.pile[data-pile="gy"]{cursor:pointer}
.cell.pile span{font:700 18px var(--ui);color:var(--fg)}
.cell.pile.stack{background:radial-gradient(circle,#8a4fd0 0 16%,#2a1650 17% 36%,#6a35b0 37% 42%,#1b1033 43%);box-shadow:2px 2px 0 #2a1650,4px 4px 0 #1b1033,0 0 10px #8a4fd0aa;color:#fff;text-shadow:0 1px 2px #000}
.cell.pile.stack span{color:#fff}
.cell.ready{outline:2px solid var(--gold);box-shadow:0 0 14px #ffc83acc;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px #fff3b0}}
.cell.fxin .card{animation:drop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{0%{transform:translateY(-40%) scale(1.5);opacity:0;filter:brightness(3)}60%{opacity:1}100%{transform:none;filter:none}}
.mid{display:flex;align-items:center;justify-content:center;gap:6px;padding:3px 0}
.mid .who2{font:400 18px var(--display);letter-spacing:.12em;color:var(--gold);margin-right:6px}
.mid i{font:700 11px var(--ui);font-style:normal;padding:3px 8px;border-radius:5px;border:1px solid #28d7ff66;color:#8fb0e0;background:#04163a}
.mid i.on{background:linear-gradient(#ffe27a,#ff9a1a);color:#2b1250;border-color:#fff3b0;box-shadow:0 0 12px #ffc83a99}
.oh{display:flex;gap:3px;justify-content:center;min-height:22px}
.oh i{width:16px;height:22px;border-radius:3px;background:radial-gradient(circle,#8a4fd0 0 20%,#2a1650 21%);border:1px solid #8a4fd0}
.strip{display:flex;align-items:center;gap:10px;padding:4px 2px}
.strip .av{width:54px;height:54px;flex:none;border-radius:50%;border:2px solid var(--cy);box-shadow:0 0 14px #28d7ff88,inset 0 0 8px #0008;background:radial-gradient(circle,#2a5ac0,#0b1a3e);overflow:hidden}
.strip .av img,.strip .av svg{width:100%;height:100%;object-fit:cover}
.strip .who{flex:1;min-width:0}
.strip .who b{display:block;font:700 13px var(--ui);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lpbar{height:10px;border-radius:5px;border:1px solid #28d7ff88;background:#04163a;overflow:hidden;margin-top:3px}
.lpbar i{display:block;height:100%;background:linear-gradient(90deg,#1de9b6,#28d7ff);transition:width .5s}
.lpn{font:700 34px var(--ui);letter-spacing:.02em;font-variant-numeric:tabular-nums;min-width:96px;text-align:right;background:linear-gradient(#fff6c8,#ffc83a 60%,#c46a10);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #3a1a00)}
#board.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:50%;font:700 44px var(--ui);letter-spacing:.04em;animation:pop 1.2s ease forwards;transform:translateX(-50%);white-space:nowrap;text-shadow:0 3px 0 #000,0 0 14px currentColor}
.pop.ai{top:3%}.pop.me{bottom:3%}
.pop-dmg{color:var(--red)}.pop-heal{color:var(--green)}.pop-info{color:var(--gold);font-size:28px}
@keyframes pop{0%{opacity:0;margin-top:14px;scale:.6}20%{opacity:1;scale:1.15}100%{opacity:0;margin-top:-46px;scale:1}}

/* banner, intro, result */
#banner{position:fixed;left:0;right:0;top:34%;z-index:55;pointer-events:none;text-align:center;padding:8px 0;background:linear-gradient(90deg,transparent,#0b2a66dd 18%,#0b2a66f0 50%,#0b2a66dd 82%,transparent);border-block:2px solid var(--cy);font:400 clamp(34px,9vw,72px) var(--display);letter-spacing:.12em;color:#fff;text-shadow:0 0 18px var(--cy),0 4px 0 #0a1a4a;animation:ban 1.1s ease forwards}
#banner[hidden]{display:none}
@keyframes ban{0%{opacity:0;transform:scaleY(.1)}14%{opacity:1;transform:scaleY(1)}82%{opacity:1}100%{opacity:0;transform:scaleY(.2)}}
#intro{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#0b2a66dd,#02060ff2);overflow:hidden;cursor:pointer}
#intro[hidden]{display:none}
.intro-in{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:clamp(6px,3vw,40px);width:min(1000px,100%);padding:16px}
.pl{display:grid;justify-items:center;gap:10px;text-align:center}
.pl img{width:min(100%,clamp(100px,26vw,260px));aspect-ratio:1;border-radius:50%;border:3px solid var(--cy);box-shadow:0 0 44px #28d7ffaa;background:radial-gradient(circle,#2a5ac0,#0b1a3e);object-fit:cover}
.pl svg{width:min(100%,clamp(100px,26vw,260px));aspect-ratio:1;border-radius:50%;border:3px solid var(--cy);background:radial-gradient(circle,#2a5ac0,#0b1a3e);box-shadow:0 0 44px #28d7ffaa}
.pl.r img{border-color:#ff4d5e;box-shadow:0 0 44px #ff4d5eaa}
.pl b{font:700 clamp(12px,3.2vw,24px) var(--ui);letter-spacing:.12em;text-transform:uppercase}
.pl.l{animation:inL .7s cubic-bezier(.2,.9,.2,1) both}.pl.r{animation:inR .7s cubic-bezier(.2,.9,.2,1) both}
@keyframes inL{from{transform:translateX(-120%);opacity:0}}@keyframes inR{from{transform:translateX(120%);opacity:0}}
.vsx{font:400 clamp(48px,14vw,150px) var(--display);color:var(--red);text-shadow:0 0 30px #ff4d5e,0 6px 0 #4a0a1a;animation:slam .5s .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes slam{from{transform:scale(4);opacity:0}}
.result{text-align:center}
.result .big{font:400 clamp(40px,11vw,72px)/1 var(--display);letter-spacing:.08em;animation:slam .6s both}
.win{color:var(--gold);text-shadow:0 0 28px #ffc83a,0 5px 0 #6a3a00}
.lose{color:var(--red);text-shadow:0 0 28px #ff4d5e,0 5px 0 #4a0a1a}
.stats{display:flex;justify-content:center;gap:18px;margin:12px 0;font:600 13px var(--ui);color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.stats b{display:block;font-size:22px;color:var(--fg)}
.rules li{margin-bottom:6px;line-height:1.5}
.setrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:10px 0}
.setrow label{font:600 13px var(--ui);letter-spacing:.1em;text-transform:uppercase}
.setrow input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{padding:6px 12px;border-radius:999px;border:1px solid #3a78e0;background:#0f2556;font:700 12px var(--ui);letter-spacing:.08em;text-transform:uppercase}
.chips button.on{background:linear-gradient(#ffe27a,#ff9a1a);color:#2b1250}
@media(max-height:520px) and (orientation:landscape){
  .logo{font-size:44px}.tag{display:none}.tgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}#heroCv{height:200px}
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.log{height:120px}
}
@media(prefers-reduced-motion:reduce){.logo,.cell.ready,.cell.fxin .card,#board.shake{animation:none}.hc:hover,.deck:hover{transform:none}}
/* card */
.card{position:relative;width:100%;height:100%;border-radius:6px;background:linear-gradient(165deg,var(--f1),var(--f2));border:1px solid #000a;box-shadow:0 4px 8px #000a,inset 0 0 0 1px #ffffff55;container-type:inline-size;display:flex;flex-direction:column;overflow:hidden;color:#1a1208;transition:transform .25s}
.card.m{--f1:#dfb15f;--f2:#a8742c}.card.m.fx{--f1:#d98048;--f2:#a0421f}.card.s{--f1:#35bd9c;--f2:#14755f}.card.t{--f1:#c95aae;--f2:#712463}
.card .hd{display:flex;align-items:center;gap:2cqw;margin:3cqw 3cqw 0;padding:1.2cqw 2cqw;background:linear-gradient(#f6efd9,#d9cca4);border-radius:1.5cqw;box-shadow:inset 0 0 0 .5cqw #0005;min-height:15cqw}
.card .nm{flex:1;font:800 8cqw/1.05 var(--body);color:#1a1208;overflow:hidden;max-height:16cqw}
.card .at{flex:none;width:11cqw;height:11cqw;border-radius:50%;display:grid;place-items:center;font:800 6.5cqw/1 serif;color:#fff;background:radial-gradient(circle at 35% 30%,#fff9,var(--ac) 55%);border:.7cqw solid #fff;box-shadow:0 0 0 .5cqw #000a}

function audCtx(){
  if(AUD.N)return AUD.N;
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    const ctx=new C();AUD.N=audBuild(ctx,ctx.destination);audApply();
    AUD.timer=setInterval(musicTick,90);return AUD.N}catch(e){return null}
}
function audApply(){
  const N=AUD.N;if(!N)return;const t=N.ctx.currentTime;
  N.mus.gain.cancelScheduledValues(t);N.mus.gain.setTargetAtTime(AUD.on.music?AUD.vol.music*.9:0,t,.15);
  N.sfx.gain.cancelScheduledValues(t);N.sfx.gain.setTargetAtTime(AUD.on.sfx?AUD.vol.sfx:0,t,.05);
}
function musicTick(){
  const N=AUD.N;if(!N||!AUD.track||document.hidden||N.ctx.state!=='running')return;
  const q=60/AUD.track.bpm/4;
  if(AUD.next<N.ctx.currentTime)AUD.next=N.ctx.currentTime+.05;
  while(AUD.next<N.ctx.currentTime+.4){
    try{AUD.track.play(N,N.mus,AUD.next,Math.floor(AUD.step/16)%8,AUD.step%16,q)}catch(e){}
    AUD.step++;AUD.next+=q;
  }
}
function playMusic(name){
  AUD.want=name;
  const N=audCtx();if(!N)return;
  if(N.ctx.state==='suspended')N.ctx.resume();
  if(AUD.cur===name)return;
  AUD.cur=name;
  const t=N.ctx.currentTime;
  if(AUD.track){N.mus.gain.cancelScheduledValues(t);N.mus.gain.setTargetAtTime(0,t,.12)}
  setTimeout(()=>{if(AUD.cur!==name)return;AUD.track=name==='none'?null:TRACKS[name];AUD.step=0;AUD.next=N.ctx.currentTime+.1;audApply()},AUD.track?380:0);
}
document.addEventListener('visibilitychange',()=>{const N=AUD.N;if(!N)return;if(document.hidden)N.ctx.suspend();else N.ctx.resume()});
function unlockAudio(){const N=audCtx();if(N&&N.ctx.state==='suspended')N.ctx.resume();if(AUD.want&&!AUD.track&&AUD.cur!==AUD.want){const w=AUD.want;AUD.cur=null;playMusic(w)}}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));

}

/* ---------- Visual FX (particles, lunge, shake, confetti) ---------- */
const FXP=[];let fxRun=false;
function fxResize(){const c=$('#fxc');if(!c)return;const d=Math.min(2,devicePixelRatio||1);c.width=Math.floor(innerWidth*d);c.height=Math.floor(innerHeight*d);c._d=d}
addEventListener('resize',fxResize);
function fxStart(){if(fxRun)return;fxRun=true;if(!$('#fxc').width||$('#fxc').width<10)fxResize();requestAnimationFrame(fxLoop)}
function fxLoop(){
  const c=$('#fxc'),x=c.getContext('2d'),d=c._d||1;
  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.globalCompositeOperation='lighter';
  for(let i=FXP.length-1;i>=0;i--){
    const p=FXP[i];p.life-=p.dec;
    if(p.life<=0){FXP.splice(i,1);continue}
    x.globalAlpha=Math.max(0,Math.min(1,p.life));
    if(p.ring){p.r+=p.grow;x.strokeStyle=p.c;x.lineWidth=Math.max(1,6*p.life)*d;x.beginPath();x.arc(p.x*d,p.y*d,p.r*d,0,6.2832);x.stroke();continue}
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.985;
    x.fillStyle=p.c;x.beginPath();x.arc(p.x*d,p.y*d,Math.max(.6,p.s*p.life)*d,0,6.2832);x.fill();
    if(p.rect){x.fillRect(p.x*d,p.y*d,p.s*d*1.6,p.s*d*.8)}
  }
  if(FXP.length)requestAnimationFrame(fxLoop);else{fxRun=false;x.clearRect(0,0,c.width,c.height)}
}
function burst(x,y,o){
  if(G&&G.fast)return;o=o||{};
  const cols=o.colors||['#ffd54a','#ff9a1a','#ffffff','#28d7ff'];
  for(let i=0;i<(o.n||30);i++){const a=Math.random()*6.2832,sp=(o.speed||6)*(.35+Math.random());FXP.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up||0),life:1,dec:.016+Math.random()*.02,s:(o.size||4.5)*(.5+Math.random()),c:cols[i%cols.length],g:o.g==null?.18:o.g})}
  if(o.ring!==false)FXP.push({ring:1,x,y,r:6,grow:o.grow||5,life:1,dec:.035,c:cols[0]});
  fxStart();
}
function centerOf(el){const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}
function elFor(c){
  if(!c||!G||!G.me)return null;
  for(const s of ['me','ai']){const p=G[s];
    let i=p.mz.indexOf(c);if(i>=0)return document.querySelector(`.cell[data-side="${s}"][data-zone="mz"][data-i="${i}"]`);
    i=p.st.indexOf(c);if(i>=0)return document.querySelector(`.cell[data-side="${s}"][data-zone="st"][data-i="${i}"]`)}
  return null;
}
function shake(){const b=$('#board');if(!b||G.fast)return;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
const wait=ms=>(G&&G.fast)?Promise.resolve():new Promise(r=>setTimeout(r,ms));
function summonFx(c){if(G.fast)return;const el=elFor(c);if(!el)return;const [x,y]=centerOf(el);burst(x,y,{n:34,speed:5,colors:['#ffd54a','#fff3b0','#28d7ff','#ffffff'],up:1.5,grow:4})}
function destroyFx(c){if(G.fast)return;const el=elFor(c);if(!el)return;const [x,y]=centerOf(el);burst(x,y,{n:46,speed:8,colors:['#ff9a1a','#ff4d5e','#ffd54a','#ffffff'],size:5,grow:7});shake()}
async function lungeFx(s,att,target){
  if(G.fast)return;
  const a=elFor(att),t=target?elFor(target):document.getElementById(opp(s)+'Strip');
  if(!a||!t||!a.animate){sfx('hit');return}
  const ra=a.getBoundingClientRect(),rt=t.getBoundingClientRect();
  const dx=(rt.left+rt.width/2)-(ra.left+ra.width/2),dy=(rt.top+rt.height/2)-(ra.top+ra.height/2);
  a.style.zIndex=30;
  const an=a.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${-dx*.05}px,${-dy*.05}px) scale(1.06)`,offset:.22},{transform:`translate(${dx*.82}px,${dy*.82}px) scale(1.28)`,offset:.55},{transform:'translate(0,0) scale(1)'}],{duration:640,easing:'ease-in-out'});
  await wait(350);
  const [x,y]=centerOf(t);burst(x,y,{n:36,speed:7,colors:['#ffffff','#ffd54a','#28d7ff'],size:4,grow:8});sfx('hit',1.1);shake();
  await an.finished.catch(()=>{});a.style.zIndex='';
}
function confetti(){
  if(G.fast)return;
  const cols=['#ffd54a','#ff4d5e','#28d7ff','#3ddc97','#ffffff','#c46aff'];
  for(let i=0;i<160;i++)FXP.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,life:1,dec:.004+Math.random()*.004,s:3+Math.random()*3,c:cols[i%cols.length],g:.03,rect:1});
  fxStart();
}

function showResult(w){

    const ag=$('#again');if(ag)ag.onclick=()=>{closeModal();startGame(G.opts)};
    $('#home').onclick=()=>{closeModal();leaveRoom();showTitle()};
  };
  if(G.fast)return;setTimeout(go,900);
}

  animLP.iv=setInterval(()=>{let done=true;for(const s of ['me','ai']){const t=G[s].lp;let c=G.shown[s];if(c!==t){const d=Math.max(10,Math.ceil(Math.abs(t-c)/12));c=c<t?Math.min(t,c+d):Math.max(t,c-d);G.shown[s]=c;done=false}const e=$('#'+s+'LP');if(e)e.textContent=c;const bar=$('#'+s+'Strip .lpbar i');if(bar)bar.style.width=Math.min(100,c/80)+'%'}if(done)clearInterval(animLP.iv)},25);
}
function damage(s,n){if(n<=0||G.over)return;G[s].lp=Math.max(0,G[s].lp-n);popup(s,'-'+n,'pop-dmg');sfx('dmg');if(n>=800)shake();AUD.tension=G.me.lp<=3000||G.ai.lp<=3000;animLP();log(`${s==='me'?'Bạn':'Đối thủ'} mất ${n} LP.`);checkWin()}
function heal(s,n){G[s].lp+=n;popup(s,'+'+n,'pop-heal');sfx('heal');animLP();log(`${s==='me'?'Bạn':'Đối thủ'} hồi ${n} LP.`)}
function checkWin(){if(G.over)return;const a=G.me.lp<=0,b=G.ai.lp<=0;if(a||b)endGame(a&&b?'draw':a?'ai':'me')}
function endGame(w){
  if(G.over)return;G.over=true;G.winner=w;
  render();
  if(G.online)flushNow();
  if(G.fast)return;
  showResult(w);
}
async function draw(s,n){
  const p=G[s];
  for(let i=0;i<n;i++){
    if(G.over)return;
    if(!p.deck.length){log(`${s==='me'?'Bạn':'Đối thủ'} hết bài để rút!`,1);endGame(opp(s));return}
    p.hand.push(p.deck.shift());
    if(s==='me')sfx('card');
  }
  if(n&&!G.fast&&G.turn>0){render();await sleep(250)}
}
async function destroy(c,reason){
  const s=ownerOf(c);if(!s)return false;
  if(reason==='effect'&&c.d.imm){log(`${c.d.n} miễn nhiễm hiệu ứng phá hủy!`);popup(s,'MIỄN NHIỄM','pop-info');return false}
  const p=G[s];
  destroyFx(c);
  removeFromField(c);p.gy.push(c);
  for(const e of c.eq){removeFromField(e);e.host=null;p.gy.push(e)}
  c.eq=[];
  if(c.host){c.host.eq=c.host.eq.filter(x=>x!==c);c.host=null}
  c.fd=false;c.pos='atk';
  sfx('destroy');log(`${c.d.n} bị phá hủy.`);render();await sleep(450);
  if(c.d.t==='m'&&c.d.eff&&c.d.eff.on==='des'&&reason!=='tribute')await monsterEffect(c,s,'des');
  return true;
}
async function monsterEffect(c,s,when){
  const e=c.d.eff;if(!e||e.on!==when||G.over)return;
  log(`Hiệu ứng của ${c.d.n} được kích hoạt.`);
  switch(e.k){
    case 'draw1':await draw(s,1);break;
    case 'heal500':heal(s,500);break;
    case 'heal800':heal(s,800);break;
    case 'burn500':damage(opp(s),500);break;
    case 'destroy1':{
      const list=G[opp(s)].mz.filter(Boolean);if(!list.length)break;
      const r=await pick(s,list,1,`${c.d.n}: chọn quái thú để phá hủy`,'strong');
      if(r&&r[0])await destroy(r[0],'effect');break}
  }
}
async function normalSummon(s,c,set){
  const p=G[s];const n=tribNeeded(c);let trib=[];
  if(n){
    const r=await pick(s,p.mz.filter(Boolean),n,`Chọn ${n} quái thú làm vật tế`,'weak',{cancel:true});
    if(!r)return false;trib=r;
  }
  for(const t of trib)await destroy(t,'tribute');
  const slot=free(p.mz);if(slot<0)return false;
  removeHand(p,c);p.mz[slot]=c;c.fd=!!set;c.pos=set?'def':'atk';c.tp=G.turn;c.atk=false;c.mv=false;p.ns--;
  sfx(set?'set':'summon');c._fx=Date.now();
  log(set?`${s==='me'?'Bạn':'Đối thủ'} úp 1 quái thú.`:`${s==='me'?'Bạn':'Đối thủ'} triệu hồi ${c.d.n}${n?` (hiến tế ${n})`:''}.`);
  render();if(!set)summonFx(c);await sleep(500);
  if(!set){await monsterEffect(c,s,'sum');if(ownerOf(c))await trapTrigger(opp(s),'summon',{c})}
  return true;
}
function canSummon(s,c){const p=G[s];if(p.ns<=0)return false;const n=tribNeeded(c);return p.mz.filter(Boolean).length>=n&&(n>0||p.mz.includes(null))}
function canSetST(s){return G[s].st.includes(null)}
function setST(s,c){const p=G[s];const i=free(p.st);if(i<0)return false;removeHand(p,c);p.st[i]=c;c.fd=true;c.tp=G.turn;sfx('card');log(`${s==='me'?'Bạn':'Đối thủ'} úp 1 lá bài.`);return true}
function canPlaySpell(s,c,from){
  const p=G[s],o=G[opp(s)];
  if(from==='hand'&&c.d.sub!=='field'&&c.d.sub!=='equip'&&false)return false;
  switch(c.d.id){
    case 'mi':return p.deck.length>=2;
    case 'ads':return p.lp>1000&&p.deck.length>=3;
    case 'bao':case 'hop':return o.mz.some(Boolean);
    case 'holeden':return o.mz.some(Boolean)||p.mz.some(Boolean);
    case 'thanhloc':return o.st.some(Boolean)||!!o.field;
    case 'hoisinh':return p.gy.some(x=>x.d.t==='m')&&p.mz.includes(null);
    case 'aothun':case 'micro':return p.mz.some(m=>m&&!m.fd)&&(from==='set'||p.st.includes(null));
  }
  return true;
}
async function playSpell(s,c,from){
  const p=G[s],sub=c.d.sub;
  if(sub==='equip'){
    const r=await pick(s,p.mz.filter(m=>m&&!m.fd),1,`${c.d.n}: chọn quái thú để trang bị`,'strong',{cancel:true});
    if(!r)return false;
    if(from==='hand'){const i=free(p.st);if(i<0)return false;removeHand(p,c);p.st[i]=c}
    c.fd=false;c.host=r[0];r[0].eq.push(c);sfx('card');
    log(`${s==='me'?'Bạn':'Đối thủ'} trang bị ${c.d.n} cho ${r[0].d.n}.`);return true;
  }
  if(sub==='field'){
    removeHand(p,c);if(p.field)p.gy.push(p.field);p.field=c;c.fd=false;sfx('card');
    log(`${s==='me'?'Bạn':'Đối thủ'} kích hoạt ${c.d.n}.`);return true;
  }
  if(from==='hand')removeHand(p,c);else removeFromField(c);
  c.fd=false;sfx('spell');log(`${s==='me'?'Bạn':'Đối thủ'} kích hoạt ${c.d.n}.`);
  popup(s,c.d.n,'pop-info');render();await sleep(600);
  await resolveSpell(s,c);
  p.gy.push(c);return true;
}
async function resolveSpell(s,c){
  const p=G[s],o=G[opp(s)];
  switch(c.d.id){
    case 'cafe':heal(s,1000);break;
    case 'pho':heal(s,1500);break;
    case 'mi':await draw(s,2);break;
    case 'ads':damage(s,1000);if(!G.over)await draw(s,3);break;
    case 'khuyenmai':p.ns++;break;
    case 'bao':for(const m of [...o.mz])if(m)await destroy(m,'effect');break;
    case 'holeden':for(const m of [...o.mz,...p.mz])if(m)await destroy(m,'effect');break;
    case 'hop':{const l=o.mz.filter(Boolean);if(!l.length)break;const r=await pick(s,l,1,'Chọn quái thú để phá hủy','strong');if(r&&r[0])await destroy(r[0],'effect');break}
    case 'thanhloc':for(const x of [...o.st])if(x)await destroy(x,'effect');if(o.field)await destroy(o.field,'effect');break;
    case 'hoisinh':{
      const l=p.gy.filter(x=>x.d.t==='m');const slot=free(p.mz);if(!l.length||slot<0)break;
      const r=await pick(s,l,1,'Chọn quái thú trong Mộ để hồi sinh','strong');if(!r)break;
      const m=r[0];p.gy.splice(p.gy.indexOf(m),1);p.mz[slot]=m;m.fd=false;m.pos='atk';m.tp=G.turn;m.atk=false;m.mv=true;
      log(`${m.d.n} được hồi sinh.`);render();await sleep(400);await monsterEffect(m,s,'sum');break}
  }
}
async function togglePos(s,c){
  c.mv=true;
  if(c.fd){sfx('flip');c.fd=false;c.pos='atk';log(`Bạn lật ngửa ${c.d.n}.`);render();await sleep(400);await monsterEffect(c,s,'sum');await monsterEffect(c,s,'flip');if(ownerOf(c))await trapTrigger(opp(s),'summon',{c})}
  else{c.pos=c.pos==='atk'?'def':'atk';log(`${c.d.n} chuyển sang thế ${c.pos==='atk'?'tấn công':'thủ'}.`)}
}
function canMove(c){return !c.atk&&!c.mv&&c.tp!==G.turn}
async function trapTrigger(ds,trig,ctx){
  const p=G[ds];let negated=false;
  for(let loop=0;loop<3&&!G.over;loop++){
    const el=p.st.filter(c=>c&&c.fd&&c.d.t==='t'&&c.d.trig===trig&&c.tp<G.turn);
    if(!el.length)break;
    let chosen=null;
    if(isAI(ds)){chosen=aiTrap(ds,el,trig,ctx)}
    else{
      const txt=trig==='attack'?`${ctx.att.d.n} (ATK ${ATK(ctx.att)}) tấn công${ctx.target?' '+(ctx.target.fd?'quái thú úp':ctx.target.d.n):' trực tiếp'}! Kích hoạt bẫy?`:`Đối thủ lật ngửa ${ctx.c.d.n}. Kích hoạt bẫy?`;
      const r=await pick(ds,el,1,txt,'any',{skip:true});chosen=r?r[0]:null;
    }
    if(!chosen)break;
    const n=await fireTrap(ds,chosen,ctx);
    if(n){negated=true;break}
    if(!ownerOf(ctx.att||ctx.c))break;
  }
  return {negated};
}
async function fireTrap(s,c,ctx){
  c.fd=false;sfx('trap');log(`${s==='me'?'Bạn':'Đối thủ'} kích hoạt bẫy ${c.d.n}!`,1);popup(s,c.d.n,'pop-info');banner('BẪY KÍCH HOẠT!');render();await sleep(900);
  let neg=false;
  switch(c.d.id){
    case 'chotsale':neg=true;break;
    case 'tuchoi':await destroy(ctx.att,'effect');neg=true;break;
    case 'phanhoi':neg=true;damage(opp(s),800);break;
    case 'reviewbao':for(const m of [...G[opp(s)].mz])if(m&&m.pos==='atk'&&!m.fd)await destroy(m,'effect');neg=true;break;
    case 'hoden':if(ATK(ctx.c)>=1500)await destroy(ctx.c,'effect');break;
  }
  removeFromField(c);G[s].gy.push(c);render();return neg;
}
async function attack(s,att,target){
  const o=opp(s);att.atk=true;
  log(`${att.d.n} (ATK ${ATK(att)}) tấn công ${target?(target.fd?'quái thú úp':target.d.n):'trực tiếp'}!`,1);
  banner('TẤN CÔNG!');sfx('atk');render();await sleep(600);
  const r=await trapTrigger(o,'attack',{att,target});
  if(G.over||!ownerOf(att))return;
  if(r.negated){log('Đòn tấn công bị vô hiệu.');return}
  await lungeFx(s,att,target);
  if(G.over||!ownerOf(att))return;
  if(!target){damage(o,ATK(att));return}
  if(!ownerOf(target)){log('Mục tiêu đã biến mất.');return}
  if(target.fd){sfx('flip');target.fd=false;log(`Lật ngửa: ${target.d.n}!`);render();await sleep(500);await monsterEffect(target,o,'flip');if(G.over||!ownerOf(att)||!ownerOf(target))return}
  const a=ATK(att);
  if(target.pos==='atk'){
    const d=ATK(target);
    if(a>d){await destroy(target,'battle');damage(o,a-d)}
    else if(a<d){await destroy(att,'battle');damage(s,d-a)}
    else{log('Hòa lực, cả hai bị phá hủy.');await destroy(target,'battle');await destroy(att,'battle')}
  }else{
    const d=DEF(target);
    if(a>d)await destroy(target,'battle');
    else if(a<d)damage(s,d-a);
    else log('Không bên nào bị phá hủy.');
  }
}
async function startTurn(s){
  if(G.over)return;
  G.turn++;G.cur=s;const p=G[s];p.ns=1;
  p.mz.forEach(c=>{if(c){c.atk=false;c.mv=false}});
  G.phase='draw';render();
  banner(s==='me'?'LƯỢT CỦA BẠN':'LƯỢT ĐỐI THỦ');sfx('turn');await sleep(700);
  if(G.turn>1)await draw(s,1);
  if(G.over)return;
  G.phase='main';log(`Lượt ${G.turn}: ${s==='me'?'Bạn':'Đối thủ'}`,1);render();
  if(isAI(s)){await aiTurn(s);if(!G.over)await endTurn(s)}
}
async function endTurn(s){
  const p=G[s];
  while(p.hand.length>6&&!G.over){const r=await pick(s,p.hand,1,'Bỏ bớt 1 lá (tối đa 6 lá trên tay)','weak');const c=r[0];removeHand(p,c);p.gy.push(c);log(`${s==='me'?'Bạn':'Đối thủ'} bỏ ${c.d.n}.`)}
  G.phase='end';render();await sleep(300);
  if(G.over)return;
  if(G.online){G.cur=opp(s);G.pend=opp(s);render();await flushNow();return}
  await startTurn(opp(s));
}

/* ---------- AI ---------- */
function v(c){return c.d.t==='m'?(c.fd?1500:ATK(c)):600}
function aiPick(list,count,mode){const a=[...list];if(mode!=='any')a.sort((x,y)=>mode==='weak'?v(x)-v(y):v(y)-v(x));return a.slice(0,count)}
function aiTrap(s,el,trig,ctx){
  if(G.easy&&Math.random()<.5)return null;
  if(trig==='attack'){if(ATK(ctx.att)<1000&&Math.random()<.6)return null;return el[0]}
  if(trig==='summon'){return ATK(ctx.c)>=1500?el[0]:null}
  return null;
}
function aiWants(s,c){
  const p=G[s],o=G[opp(s)];
  const oc=o.mz.filter(Boolean).length,mc=p.mz.filter(Boolean).length;
  if(!canPlaySpell(s,c,'hand'))return false;
  switch(c.d.id){
    case 'cafe':return p.lp<=7000;
    case 'pho':return p.lp<=6500;
    case 'mi':return p.deck.length>6;
    case 'ads':return p.lp>3500&&p.deck.length>8;
    case 'khuyenmai':return p.hand.filter(x=>x.d.t==='m').length>=2;
    case 'bao':return oc>=2&&oc>=mc;
    case 'holeden':return oc>=2&&oc>mc+1;
    case 'hop':return oc>=1;
    case 'thanhloc':return o.st.filter(Boolean).length>=2||!!o.field;
    case 'hoisinh':return p.gy.some(x=>x.d.t==='m'&&x.d.atk>=1500);
    case 'aothun':case 'micro':return true;
    case 'hoitruong':return !p.field;
  }
  return false;
}
async function aiSummon(s){
  const p=G[s],o=G[opp(s)];
  while(p.ns>0&&!G.over){
    const mons=p.hand.filter(c=>c.d.t==='m');if(!mons.length)break;
    const own=p.mz.filter(Boolean).sort((a,b)=>v(a)-v(b));
    let best=null,bv=-1e9;
    for(const m of mons){
      const n=tribNeeded(m);if(n>own.length)continue;if(n===0&&!p.mz.includes(null))continue;
      const cost=own.slice(0,n).reduce((a,c)=>a+v(c),0);const val=m.d.atk-cost*0.9;
      if(n>0&&val<600)continue;
      if(val>bv){bv=val;best=m}
    }
    if(!best)break;
    const oStrong=Math.max(0,...o.mz.filter(c=>c&&!c.fd).map(ATK));
    const set=(best.d.eff&&best.d.eff.on==='flip')||(best.d.atk<oStrong&&best.d.def>=best.d.atk);
    if(!(await normalSummon(s,best,set)))break;
    await sleep(500);
  }
}
async function aiTurn(s){
  const p=G[s],o=G[opp(s)];
  await sleep(600);
  for(let g=0;g<10&&!G.over;g++){
    let acted=false;
    for(const c of [...p.hand]){
      if(c.d.t==='s'&&aiWants(s,c)){if(await playSpell(s,c,'hand')){acted=true;render();await sleep(600);break}}
    }
    if(!acted)break;
  }
  if(G.over)return;
  await aiSummon(s);
  for(const c of [...p.hand]){if(c.d.t==='t'&&canSetST(s)){setST(s,c);render();await sleep(300)}}
  if(G.over)return;
  if(G.turn>1){
    G.phase='battle';render();await sleep(400);
    for(const m of [...p.mz]){
      if(G.over)break;
      if(!m||m.fd||m.pos!=='atk'||m.atk||!ownerOf(m))continue;
      if(G.easy&&Math.random()<.3)continue;
      const targets=o.mz.filter(Boolean);
      if(!targets.length){await attack(s,m,null);await sleep(400);continue}
      const a=ATK(m);let best=null,bs=-1e9;
      for(const t of targets){
        let sc=-1e9;
        if(t.fd){sc=a>=1700?200:-1e9}
        else if(t.pos==='atk'){const d=ATK(t);if(a>d)sc=1000+(a-d);else if(a===d&&a>=ATK(t)&&p.mz.filter(Boolean).length>=2)sc=-50}
        else{if(a>DEF(t))sc=500+a-DEF(t)}
        if(sc>bs){bs=sc;best=t}
      }
      if(best){await attack(s,m,best);await sleep(400)}
    }
  }
}

/* ---------- Pick modal / sheets ---------- */
function openModal(html){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
function visibleTo(c,viewer){return !(c.fd&&ownerOf(c)&&ownerOf(c)!==viewer)}
function pick(s,list,count,title,mode,opt){
  opt=opt||{};
  if(isAI(s))return Promise.resolve(opt.skip?aiPick(list,1,mode):aiPick(list,count,mode));
  if(!list.length)return Promise.resolve(null);
  if(!opt.skip&&!opt.cancel&&list.length<=count)return Promise.resolve([...list]);
  if(G.online&&s==='ai')return remotePick(list,count,title,opt);
  return pickUI(list,count,title,opt);
}
function pickUI(list,count,title,opt){
  opt=opt||{};
  return new Promise(res=>{
    const chosen=[];
    openModal(`<h3>${title}</h3><div class="pickrow">${list.map((c,i)=>`<div class="pk" data-i="${i}" tabindex="0"><div class="cw">${cardHTML(c,{hide:!visibleTo(c,'me'),own:true})}</div>${visibleTo(c,'me')?c.d.n:'Quái thú úp'}</div>`).join('')}</div><div class="btns">${count>1?'<button class="btn" id="pkOk" disabled>Xác nhận</button>':''}${opt.skip?'<button class="btn" id="pkNo">Không kích hoạt</button>':''}${opt.cancel?'<button class="btn" id="pkNo">Hủy</button>':''}</div>`);
    const done=r=>{closeModal();render();res(r)};
    const toggle=el=>{
      const c=list[+el.dataset.i];
      if(count===1){done([c]);return}
      const k=chosen.indexOf(c);
      if(k>=0){chosen.splice(k,1);el.classList.remove('on')}else if(chosen.length<count){chosen.push(c);el.classList.add('on')}
      $('#pkOk').disabled=chosen.length!==count;
    };
    document.querySelectorAll('.pk').forEach(el=>{el.onclick=()=>toggle(el);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(el)}}});
    const ok=$('#pkOk');if(ok)ok.onclick=()=>done([...chosen]);
    const no=$('#pkNo');if(no)no.onclick=()=>done(null);
  });
}
function typeLine(c){
  const d=c.d;
  if(d.t==='m')return `Quái thú · Cấp ${d.lv} · ATK ${ATK(c)} / DEF ${DEF(c)}${tribNeeded(c)?` · Cần ${tribNeeded(c)} vật tế`:''}`;
  if(d.t==='s')return 'Bài Phép'+(d.sub==='equip'?' · Trang bị':d.sub==='field'?' · Sân':'');
  return 'Bài Bẫy';
}
function showDetail(c){
  const el=$('#detail');
  if(!c||!visibleTo(c,'me')){el.innerHTML=`<div class="empty">${c?'Lá bài úp của đối thủ.':'Bấm vào một lá bài để xem chi tiết.'}</div>`;return}
  el.innerHTML=`<div class="cw">${cardHTML(c,{})}</div><div><h3>${c.d.n}</h3><div class="ty">${typeLine(c)}</div><p>${c.d.fx||''}</p></div>`;
}
function sheet(c,buttons){
  openModal(`<div class="sheetcard"><div class="cw">${cardHTML(c,{})}</div><div><h3>${c.d.n}</h3><div class="ty" style="color:var(--gold);margin-bottom:6px">${typeLine(c)}</div><p style="margin:0;line-height:1.5">${c.d.fx||''}</p></div></div><div class="btns">${buttons.map((b,i)=>`<button class="btn" data-b="${i}">${b.t}</button>`).join('')}<button class="btn ghost" id="shClose">Đóng</button></div>`);
  document.querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>{closeModal();act(buttons[+el.dataset.b].f)});
  $('#shClose').onclick=closeModal;
}

/* ---------- Rendering ---------- */

function cell(c,s,zone,i){

/* ---------- Card tilt (pseudo 3D) ---------- */
let tiltEl=null;
function tiltReset(){if(tiltEl){tiltEl.style.removeProperty('--rx');tiltEl.style.removeProperty('--ry');tiltEl.style.removeProperty('--mx');tiltEl=null}}

/* ---------- Online (2 players, shared db) ---------- */
let DB=null,USER=null,ME_ID=null;
const OL={code:null,role:null,unsubs:[],v:0,applied:0,ansWait:{},lastPrompt:0,seenPrompt:0,pendingPrompt:null,starting:false,started:false,writing:false,dirty:false,timer:0};
const otherRole=r=>r==='host'?'guest':'host';
const rdoc=n=>DB.doc(`rooms/${OL.code}/parts/${n}`);
function randCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];return c}
async function ensureOnline(){
  if(DB&&ME_ID)return true;
  try{const c=window.claude;if(c&&c.use){DB=await c.use('db');USER=await c.use('user');ME_ID=USER?await USER.id():null}}catch(e){DB=null}
  return !!(DB&&ME_ID);
}
const ONLINE_NEED='Chơi online cần mở game trong claude.ai, đã đăng nhập và có quyền Cộng tác (Contributor) trên trang này.';
function showErr(t){const e=$('#onlineErr');e.textContent=t;e.hidden=!t}
/* serialization */
const cardS=c=>c?{id:c.d.id,u:c.uid,f:c.fd?1:0,p:c.pos,e:c.eq.map(x=>x.uid),h:c.host?c.host.uid:0,a:c.atk?1:0,m:c.mv?1:0,t:c.tp}:null;
const pS=p=>({lp:p.lp,ns:p.ns,deck:p.deck.map(cardS),hand:p.hand.map(cardS),gy:p.gy.map(cardS),mz:p.mz.map(cardS),st:p.st.map(cardS),field:cardS(p.field)});
function cardD(o,map){if(!o)return null;const c={d:D[o.id],uid:o.u,fd:!!o.f,pos:o.p,eq:[],host:null,atk:!!o.a,mv:!!o.m,tp:o.t,_e:o.e,_h:o.h};map[o.u]=c;return c}
function pD(o,map){const l=a=>a.map(x=>cardD(x,map));return {lp:o.lp,ns:o.ns,deck:l(o.deck),hand:l(o.hand),gy:l(o.gy),mz:l(o.mz),st:l(o.st),field:cardD(o.field,map)}}
function linkAll(map){for(const u in map){const c=map[u];c.eq=(c._e||[]).map(x=>map[x]).filter(Boolean);c.host=c._h?map[c._h]||null:null;delete c._e;delete c._h}}
function cardIndex(){const m={};for(const s of ['me','ai']){const p=G[s];[p.deck,p.hand,p.gy,p.mz,p.st,[p.field]].forEach(a=>a.forEach(c=>{if(c)m[c.uid]=c}))}return m}
function buildState(){
  const mine=OL.role,other=otherRole(mine),rs=x=>x==='me'?mine:other;
  OL.v++;
  return {v:OL.v,by:mine,turn:G.turn,cur:rs(G.cur||'me'),phase:G.phase,pend:G.pend?rs(G.pend):null,over:G.over?1:0,winner:G.winner?(G.winner==='draw'?'draw':rs(G.winner)):null,log:G.log.slice(-40),p:{[mine]:pS(G.me),[other]:pS(G.ai)}};
}
function pushSoon(){if(!G.online||!DB)return;clearTimeout(OL.timer);OL.timer=setTimeout(flushNow,150)}
async function flushNow(){
  if(!G.online||!DB)return;
  clearTimeout(OL.timer);
  if(OL.writing){OL.dirty=true;return OL.writing}
  OL.writing=(async()=>{
    try{do{OL.dirty=false;await rdoc('state').set(buildState())}while(OL.dirty)}catch(e){console.error(e)}
    OL.writing=false;
  })();
  return OL.writing;
}
const swapP=t=>t.replace(/Bạn|Đối thủ/g,m=>m==='Bạn'?'Đối thủ':'Bạn');
function applyState(st){
  if(st.by===OL.role||st.v<=OL.applied)return;
  const mine=OL.role,other=otherRole(mine),toSide=r=>r===mine?'me':'ai';
  OL.applied=st.v;OL.v=Math.max(OL.v,st.v);
  const fresh=!G||!G.online||G.code!==OL.code;
  if(fresh){
    G={turn:0,cur:null,phase:'',over:false,busy:false,fast:false,auto:false,easy:false,snd:G&&G.snd!==false,log:[],shown:{me:8000,ai:8000},opts:{online:true},pend:null,online:true,code:OL.code,me:newP([]),ai:newP([])};
    showGameScreen();
  }
  const map={};
  G.me=pD(st.p[mine],map);G.ai=pD(st.p[other],map);linkAll(map);
  G.turn=st.turn;G.cur=toSide(st.cur);G.phase=st.phase;
  G.log=(st.log||[]).map(l=>({t:swapP(l.t),h:l.h}));
  G.noPush=true;
  if(fresh){G.shown.me=G.me.lp;G.shown.ai=G.ai.lp}else animLP();
  if(st.over&&!G.over){G.over=true;G.winner=st.winner==='draw'?'draw':toSide(st.winner);render();showResult(G.winner)}
  else render();
  G.noPush=false;
  tryPrompt();
  if(st.pend===mine&&!G.over&&!OL.starting){
    OL.starting=true;G.busy=true;G.pend=null;
    startTurn('me').then(()=>{G.busy=false;OL.starting=false;render()});
  }
}
/* remote prompts (the defender answers traps etc.) */
async function remotePick(list,count,title,opt){
  await flushNow();
  const id=Math.max(Date.now(),OL.lastPrompt+1);OL.lastPrompt=id;
  const idx={};list.forEach(c=>idx[c.uid]=c);
  return new Promise(async res=>{
    const t=setTimeout(()=>{delete OL.ansWait[id];res(null)},120000);
    OL.ansWait[id]=u=>{clearTimeout(t);res(u?u.map(x=>idx[x]).filter(Boolean):null)};
    try{await rdoc('prompt').set({id,by:OL.role,title,uids:list.map(c=>c.uid),count,skip:!!opt.skip,cancel:!!opt.cancel})}catch(e){clearTimeout(t);delete OL.ansWait[id];res(null)}
  });
}
function tryPrompt(){
  const p=OL.pendingPrompt;if(!p||p.id<=OL.seenPrompt||!G||!G.online)return;
  const idx=cardIndex(),list=p.uids.map(u=>idx[u]);
  if(list.some(x=>!x))return;
  OL.seenPrompt=p.id;OL.pendingPrompt=null;
  pickUI(list,p.count,swapP(p.title),{skip:p.skip,cancel:p.cancel}).then(r=>rdoc('answer').set({id:p.id,by:OL.role,uids:r?r.map(c=>c.uid):null}).catch(()=>{}));
}
function subscribeGame(){
  const err=e=>console.error(e);
  OL.unsubs.push(rdoc('state').onSnapshot(s=>{if(s.exists)applyState(s.data())},err));
  OL.unsubs.push(rdoc('prompt').onSnapshot(s=>{const p=s.exists&&s.data();if(p&&p.by!==OL.role){OL.pendingPrompt=p;tryPrompt()}},err));
  OL.unsubs.push(rdoc('answer').onSnapshot(s=>{const a=s.exists&&s.data();if(a&&a.by!==OL.role){const w=OL.ansWait[a.id];if(w){delete OL.ansWait[a.id];w(a.uids)}}},err));
}
function leaveRoom(){
  OL.unsubs.forEach(f=>{try{f()}catch(e){}});OL.unsubs=[];
  OL.code=null;OL.role=null;OL.v=0;OL.applied=0;OL.started=false;OL.starting=false;OL.pendingPrompt=null;OL.seenPrompt=0;OL.ansWait={};
  if(G)G.online=false;
  resumeHero();
}
async function createRoom(deck){
  showErr('');
  if(!await ensureOnline()){showErr(ONLINE_NEED);return}
  try{
    leaveRoom();
    OL.code=randCode();OL.role='host';
    const meta=rdoc('meta');
    await meta.set({host:ME_ID,hostDeck:deck,guest:null,guestDeck:null,status:'waiting',t:Date.now()});
    openModal(`<h3>Phòng của bạn</h3><div class="result"><p>Gửi mã này cho bạn bè:</p><div class="big win" id="roomCode" style="letter-spacing:.3em">${OL.code}</div><p style="color:var(--mute)">Đang chờ người chơi thứ hai vào phòng...</p></div><div class="btns"><button class="btn" id="cancelRoom">Hủy phòng</button></div>`);
    $('#cancelRoom').onclick=async()=>{const c=OL.code;closeModal();leaveRoom();try{await DB.doc(`rooms/${c}/parts/meta`).delete()}catch(e){}};
    OL.unsubs.push(meta.onSnapshot(s=>{const m=s.exists&&s.data();if(m&&m.guest&&!OL.started){OL.started=true;startOnlineHost(m)}},e=>console.error(e)));
  }catch(e){leaveRoom();closeModal();showErr('Không tạo được phòng. Bạn cần quyền Cộng tác (Contributor) trên trang này.')}
}
async function joinRoom(code,deck){
  showErr('');code=(code||'').trim().toUpperCase();
  if(code.length!==4){showErr('Mã phòng gồm 4 ký tự.');return}
  if(!await ensureOnline()){showErr(ONLINE_NEED);return}
  try{
    leaveRoom();OL.code=code;
    const meta=rdoc('meta'),s=await meta.get();
    if(!s.exists){OL.code=null;showErr(`Không tìm thấy phòng ${code}.`);return}
    const m=s.data();
    if(m.host===ME_ID){OL.code=null;showErr('Đây là phòng do chính bạn tạo. Hãy gửi mã cho bạn bè.');return}
    if(m.guest&&m.guest!==ME_ID){OL.code=null;showErr('Phòng này đã đủ 2 người.');return}
    OL.role='guest';
    await meta.update({guest:ME_ID,guestDeck:deck,status:'ready'});
    subscribeGame();
    openModal(`<h3>Đã vào phòng ${code}</h3><div class="result"><p>Đang chờ chủ phòng bắt đầu trận...</p></div><div class="btns"><button class="btn" id="cancelRoom">Rời phòng</button></div>`);
    $('#cancelRoom').onclick=()=>{closeModal();leaveRoom()};
  }catch(e){leaveRoom();showErr('Không vào được phòng. Bạn cần quyền Cộng tác (Contributor) trên trang này.')}
}
async function startOnlineHost(m){
  closeModal();
  OL.role='host';
  initG({online:true},[m.hostDeck,m.guestDeck]);
  G.code=OL.code;
  showGameScreen();
  subscribeGame();
  const first=Math.random()<.5?'me':'ai';
  log(first==='me'?'Bạn đi trước!':'Đối thủ đi trước!',1);
  G.cur=first;G.pend=first;G.phase='draw';
  G.noPush=true;render();G.noPush=false;
  await flushNow();
  try{await rdoc('meta').update({status:'playing'})}catch(e){}
  await G.introP;
  if(first==='me'){G.pend=null;G.busy=true;startTurn('me').then(()=>{G.busy=false;render()})}
}

/* ---------- Title screen ---------- */
function showTitle(){
  $('#game').hidden=true;$('#title').hidden=false;resumeHero();playMusic('menu');
  const w=store.get('tno_wins',0);$('#winsInfo').textContent=w?`Số trận thắng của bạn: ${w}`:'';
  window.scrollTo(0,0);
}
function rulesHTML(){
  return `<h3>Luật chơi</h3><ol class="rules"><li>Mỗi bên có 8000 LP. Về 0 LP hoặc hết bài để rút là thua.</li><li>Mỗi lượt: Rút bài, Main Phase, Battle Phase, kết thúc. Người đi trước không rút bài và không được tấn công ở lượt đầu.</li><li>Mỗi lượt Triệu hồi hoặc Úp 1 quái thú. Cấp 5-6 cần hiến tế 1 quái thú, cấp 7 trở lên cần 2.</li><li>Quái thú thế tấn công đánh nhau theo ATK: bên yếu hơn bị phá hủy, chênh lệch trừ vào LP. Đánh vào quái thú thế thủ: ATK lớn hơn DEF thì phá hủy, nhỏ hơn thì bạn mất LP chênh lệch.</li><li>Đối thủ không có quái thú thì đánh thẳng vào LP.</li><li>Bài Phép dùng trong Main Phase. Bẫy phải úp từ lượt trước, game sẽ hỏi bạn khi đối thủ tấn công hoặc triệu hồi.</li><li>Cuối lượt tối đa 6 lá trên tay.</li><li>Chơi online: một người tạo phòng và gửi mã 4 ký tự, người kia nhập mã để vào. Hai bên thay phiên nhau, Bẫy của bạn sẽ hiện hộp hỏi khi đối thủ tấn công.</li></ol><div class="btns"><button class="btn" id="shClose">Đóng</button></div>`;
}
function allCardsHTML(){
  const ids=Object.keys(D);
  return `<h3>Tất cả lá bài (${ids.length})</h3><div class="pickrow">${ids.map(id=>{const c={d:D[id],eq:[],fd:false,pos:'atk'};return `<div class="pk view" title="${D[id].fx||''}"><div class="cw">${cardHTML(c,{})}</div>${D[id].n}</div>`}).join('')}</div><div class="btns"><button class="btn" id="shClose">Đóng</button></div>`;
}
(function init(){
  const step=f=>{try{f()}catch(e){console.error(e)}};
  step(()=>{$('#heroA').innerHTML=tanSVG('tan');$('#heroB').innerHTML=bossSVG()});
  step(()=>{
    const last=store.get('tno_deck','trainer'),FEAT={trainer:'tan',mkt:'rong',control:'golem'};
    $('#deckPick').innerHTML=Object.keys(DECKS).map(k=>{
      const u=art3D(FEAT[k]),d=D[FEAT[k]];
      const art=u?`<img src="${u}" alt="">`:`<span>${d.ic.startsWith('tan')?'🧙':d.ic}</span>`;
      return `<label class="deck"><input type="radio" name="deck" value="${k}" ${k===last?'checked':''}><div class="dk-art">${art}</div><b>${DECKS[k].name}</b><small>${DECKS[k].desc}</small></label>`}).join('');
  });
  const deckVal=()=>{const e=document.querySelector('input[name=deck]:checked');return e?e.value:'trainer'};
  $('#startBtn').onclick=()=>{
    const easy=(document.querySelector('input[name=diff]:checked')||{}).value==='easy';
    const deck=deckVal();store.set('tno_deck',deck);startGame({deck,easy});
  };
  $('#createBtn').onclick=()=>createRoom(deckVal());
  $('#joinBtn').onclick=()=>joinRoom($('#codeIn').value,deckVal());
  $('#codeIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#joinBtn').click()});
  const tab=on=>{$('#tabAI').classList.toggle('on',!on);$('#tabOL').classList.toggle('on',on);$('#tabAI').setAttribute('aria-selected',String(!on));$('#tabOL').setAttribute('aria-selected',String(on));$('#panAI').hidden=on;$('#panOL').hidden=!on};
  $('#tabAI').onclick=()=>tab(false);$('#tabOL').onclick=()=>tab(true);
  $('#rulesBtn').onclick=()=>{openModal(rulesHTML());$('#shClose').onclick=closeModal};
  $('#cardsBtn').onclick=()=>openCollection('all');
  $('#setBtn').onclick=openSettings;$('#setBtn2').onclick=openSettings;
  $('#onlineHint').textContent='Chọn bộ bài ở trên, bấm "Tạo phòng mới" rồi gửi mã 4 ký tự cho bạn bè. Bạn bè mở cùng link này (trong claude.ai) và nhập mã để vào.';
  step(fxResize);step(initBG);step(initHero);step(showTitle);
})();

/* ---------- Start ---------- */
function initG(o,decks){
  const snd=G.snd;
  G={turn:0,cur:null,phase:'',over:false,busy:false,fast:!!o.fast,auto:!!o.auto,easy:!!o.easy,snd,log:[],shown:{me:8000,ai:8000},opts:o,pend:null,online:!!o.online,
     me:newP(buildDeck(decks[0])),ai:newP(buildDeck(decks[1]))};
  for(let i=0;i<5;i++){G.me.hand.push(G.me.deck.shift());G.ai.hand.push(G.ai.deck.shift())}
}
function showGameScreen(){
  $('#title').hidden=true;$('#game').hidden=false;closeModal();showDetail(null);stopHero();
  playMusic('battle');
  G.introP=(G.fast||G.auto)?Promise.resolve():showIntro();
}
function startGame(o){
  o=o||{};
  const keys=Object.keys(DECKS);
  initG(o,[o.deck||'trainer',o.aiDeck||keys[Math.floor(Math.random()*keys.length)]]);
  showGameScreen();
  const first=Math.random()<.5?'me':'ai';
  log(first==='me'?'Bạn đi trước!':'Đối thủ đi trước!',1);
  render();
  G.busy=true;
  return G.introP.then(()=>startTurn(first)).then(()=>{G.busy=false;render()});
}
window.TNO={startGame,DECKS,D,state:()=>G,act,normalSummon,attack,endTurn,playSpell,canSummon,canPlaySpell,ATK,tribNeeded,setST,canSetST,OL:()=>OL};

</script>
