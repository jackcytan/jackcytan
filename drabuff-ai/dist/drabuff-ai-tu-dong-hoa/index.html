<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Drabuff AI Automation Designer</title>
<meta name="description" content="Thiết kế quy trình tự động hóa doanh nghiệp bằng AI — Drabuff AI">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: fixed WebGL voxel field behind a single centered column — hero (copy + floating 3D sample card) → wizard (block rail + glass panel of keycap options) → engine log → blueprint result + CTA.
   Deliberately single dark theme ("control room"), accent set per page. */
:root{
  --bg:#05070D;
  --bg2:#0A0F1C;
  --panel:rgba(11,16,30,.74);
  --panel2:rgba(17,24,44,.82);
  --line:rgba(150,175,255,.13);
  --line2:rgba(150,175,255,.26);
  --fg:#E9EEFF;
  --muted:#93A0C2;
  --dim:#5E6A8C;
  --ok:#3DDC97;
  --cap:#070B15;
  --f-display:'Chakra Petch','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;margin:0;overflow-x:hidden}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit}
::selection{background:var(--acc);color:var(--acc-ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.005em;line-height:1.12;margin:0;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono)}

#bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.fx{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
   radial-gradient(90% 70% at 25% 30%, rgba(5,7,13,.78) 0%, rgba(5,7,13,.35) 55%, rgba(5,7,13,0) 80%),
   linear-gradient(180deg, rgba(5,7,13,.45) 0%, rgba(5,7,13,0) 30%, rgba(5,7,13,.25) 75%, rgba(5,7,13,.8) 100%)}
.fx::after{content:"";position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(150,175,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(150,175,255,.05) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(70% 60% at 50% 40%,#000 0%,transparent 80%);-webkit-mask-image:radial-gradient(70% 60% at 50% 40%,#000 0%,transparent 80%)}
.no3d .fx{background:radial-gradient(60% 50% at 75% 25%, var(--acc-soft) 0%, transparent 70%),radial-gradient(50% 50% at 10% 90%, var(--acc2-soft) 0%, transparent 70%)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;
  background:rgba(5,7,13,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
@media(min-width:720px){.top{padding:12px 28px}}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg);min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand .bn{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--f-display);font-size:16px;letter-spacing:.04em}
.brand small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.top-r{display:flex;align-items:center;gap:10px}
.status{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(10,15,28,.6);white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
@media(max-width:520px){.status .st-l{display:none}}

.wrap{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:0 16px 72px}
@media(min-width:720px){.wrap{padding:0 28px 96px}}

/* shared atoms */
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:10px}
.eyebrow .dot{width:8px;height:8px;border-radius:2px;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:blink 1.8s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.btn{--d:5px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 15px/1.1 var(--f-body);padding:15px 22px;border-radius:11px;
  border:1px solid var(--line2);background:linear-gradient(180deg,#1A2440,#121a30);color:var(--fg);cursor:pointer;text-decoration:none;
  transform:translateY(0);box-shadow:0 var(--d) 0 0 var(--cap),0 calc(var(--d) + 12px) 26px -10px rgba(0,0,0,.75);
  transition:transform .14s cubic-bezier(.3,.7,.3,1),box-shadow .14s,filter .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 calc(var(--d) + 2px) 0 0 var(--cap),0 calc(var(--d) + 16px) 30px -10px rgba(0,0,0,.8)}
.btn:active{transform:translateY(var(--d));box-shadow:0 0 0 0 var(--cap),0 4px 10px -4px rgba(0,0,0,.6)}
.btn.primary{background:linear-gradient(180deg,var(--acc),var(--acc-d));color:var(--acc-ink);border-color:rgba(255,255,255,.25);
  box-shadow:0 var(--d) 0 0 var(--acc-dd),0 16px 44px -12px var(--acc-glow)}
.btn.primary:hover{box-shadow:0 calc(var(--d) + 2px) 0 0 var(--acc-dd),0 20px 54px -10px var(--acc-glow)}
.btn.primary:active{box-shadow:0 0 0 0 var(--acc-dd),0 6px 20px -8px var(--acc-glow)}
.btn.ghost{background:rgba(14,20,36,.7)}
.btn.link{background:none;border-color:transparent;box-shadow:none;color:var(--muted);padding:10px 6px;text-decoration:underline;text-underline-offset:4px}
.btn.link:hover,.btn.link:active{transform:none;box-shadow:none;color:var(--fg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.arr{transition:transform .2s}
.btn:hover .arr{transform:translateX(4px)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:48px;padding-block:52px 36px;align-items:center}
@media(min-width:980px){.hero{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);padding-block:84px 64px}}
.hero h1{font-size:clamp(34px,5.2vw,62px);margin-top:20px}
.hero h1 em{font-style:normal;color:var(--acc);text-shadow:0 0 34px var(--acc-glow)}
.lead{font-size:clamp(15.5px,1.4vw,17.5px);color:var(--muted);max-width:58ch;margin-top:20px}
.lead b{color:var(--fg);font-weight:600}
.hero-cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:32px}
.hint{font-size:12px;color:var(--dim);letter-spacing:.04em}
.facts{list-style:none;padding:0;margin:40px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:560px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(8,12,22,.7);backdrop-filter:blur(8px)}
.facts li{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts li+li{border-left:1px solid var(--line)}
.facts b{font-family:var(--f-display);font-size:clamp(18px,2.2vw,24px);font-variant-numeric:tabular-nums}
.facts span{font-size:12px;color:var(--muted);line-height:1.35}

.hero-vis{perspective:1400px;display:flex;justify-content:center;padding-block:10px 30px}
.sample{position:relative;width:min(100%,430px);transform-style:preserve-3d;transform:rotateX(var(--rx,10deg)) rotateY(var(--ry,-16deg));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.sm-card{position:relative;transform-style:preserve-3d;border-radius:18px;padding:22px;background:linear-gradient(160deg,rgba(24,33,58,.92),rgba(10,15,28,.95));border:1px solid var(--line2);
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 50px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(0,0,0,.4)}
.sm-tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.sm-title{font-family:var(--f-display);font-size:22px;margin-top:10px;line-height:1.15}
.sm-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sm-meta span{font-size:11.5px;padding:4px 9px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.sm-rows{display:grid;gap:8px;margin-top:16px}
.sm-row{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.sm-row b{font-family:var(--f-mono);font-size:10.5px;color:var(--acc);letter-spacing:.08em}
.sm-bar{height:26px;border-radius:7px;background:linear-gradient(90deg,var(--acc-soft2),rgba(255,255,255,.03));border:1px solid var(--line);display:flex;align-items:center;padding:0 10px;color:var(--fg);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-float{position:absolute;border-radius:12px;padding:10px 14px;background:rgba(10,15,28,.92);border:1px solid var(--line2);backdrop-filter:blur(8px);box-shadow:0 24px 40px -16px rgba(0,0,0,.9);font-size:12px}
.sm-float.f1{right:-18px;top:-26px;transform:translateZ(80px)}
.sm-float.f2{left:-22px;bottom:-30px;transform:translateZ(110px)}
.sm-float b{display:block;font-family:var(--f-display);font-size:22px;color:var(--acc);line-height:1.1}
.sm-float small{color:var(--muted);font-size:11px}
.sm-chip{display:inline-flex;align-items:center;gap:8px}
.sm-chip i{width:9px;height:9px;border-radius:2px;background:var(--acc2);box-shadow:0 0 10px var(--acc2)}
@media(max-width:560px){.sm-float.f1{right:-4px}.sm-float.f2{left:-4px}}

/* wizard */
.wiz{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding-top:28px;scroll-margin-top:80px}
@media(min-width:960px){.wiz{grid-template-columns:230px minmax(0,1fr);gap:32px;padding-top:40px}}
.rail{position:relative}
@media(min-width:960px){.rail{position:sticky;top:96px;align-self:start}}
.rail-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--dim);margin-bottom:14px}
.stack{list-style:none;margin:0;padding:0;display:flex;gap:8px}
@media(min-width:960px){.stack{flex-direction:column;gap:8px}}
.stack li{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
@media(min-width:960px){.stack li{flex:none}}
.blk{position:relative;flex:none;width:100%;height:12px;border-radius:3px;background:#141c32;border:1px solid var(--line);box-shadow:0 4px 0 0 var(--cap);transition:background .3s,box-shadow .3s,transform .3s}
@media(min-width:960px){.blk{width:46px;height:30px;border-radius:6px;transform:perspective(300px) rotateX(38deg)}}
.stack li.done .blk{background:linear-gradient(180deg,var(--acc),var(--acc-d));border-color:transparent;box-shadow:0 4px 0 0 var(--acc-dd),0 0 22px -4px var(--acc-glow)}
.stack li.cur .blk{background:var(--acc-soft2);border-color:var(--acc);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 4px 0 0 var(--cap),0 0 26px -2px var(--acc-glow)}}
.stack .t{display:none;font-size:13.5px;color:var(--muted)}
@media(min-width:960px){.stack .t{display:block}}
.stack li.cur .t{color:var(--fg);font-weight:600}
.stack li.done .t{color:var(--fg)}

.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 50px 100px -40px rgba(0,0,0,.9);padding:clamp(20px,3.4vw,40px)}
.panel-h{display:grid;gap:8px;padding-bottom:22px;margin-bottom:26px;border-bottom:1px dashed var(--line2)}
.step-no{font-size:11.5px;letter-spacing:.16em;color:var(--acc)}
.step-title{font-size:clamp(24px,3vw,34px)}
.step-sub{color:var(--muted);max-width:62ch}
.qs{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}
@media(min-width:720px){.qs{grid-template-columns:repeat(2,minmax(0,1fr))}.q{grid-column:1/-1}.q.half{grid-column:auto}}
.q{min-width:0;display:grid;gap:12px;align-content:start}
.q-h{display:grid;gap:4px}
.q-l{font-weight:600;font-size:15.5px;color:var(--fg)}
.q-l i{font-style:normal;color:var(--acc);margin-left:4px}
.q-help{font-size:13px;color:var(--muted)}
.q-tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.inp,.ta{width:100%;background:rgba(4,7,14,.72);border:1px solid var(--line2);border-radius:11px;padding:14px 16px;color:var(--fg);font:500 15px/1.5 var(--f-body);box-shadow:inset 0 2px 0 rgba(0,0,0,.45);transition:border-color .2s,box-shadow .2s}
.inp::placeholder,.ta::placeholder{color:var(--dim)}
.inp:focus,.ta:focus{outline:none;border-color:var(--acc);box-shadow:inset 0 2px 0 rgba(0,0,0,.45),0 0 0 4px var(--acc-soft)}
.ta{min-height:96px;resize:vertical}
.q.bad .inp,.q.bad .ta{border-color:#FF6B7A}
.q.bad .opts{outline:1px dashed #FF6B7A;outline-offset:6px;border-radius:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 12px;padding-bottom:6px}
.opts.wide{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.opt{--d:6px;position:relative;text-align:left;display:flex;flex-direction:column;gap:4px;padding:13px 40px 13px 15px;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(32,43,72,.78),rgba(15,21,38,.9));color:var(--fg);font:500 14.5px/1.35 var(--f-body);cursor:pointer;min-width:0;
  box-shadow:0 var(--d) 0 0 var(--cap),0 var(--d) 0 1px rgba(150,175,255,.08),0 18px 26px -16px rgba(0,0,0,.85);transform:translateY(0);
  transition:transform .16s cubic-bezier(.3,.7,.3,1),box-shadow .16s,border-color .2s,background .2s}
.opt:hover{transform:translateY(-2px);border-color:var(--line2)}
.opt[aria-pressed="true"]{transform:translateY(4px);border-color:var(--acc);background:linear-gradient(180deg,var(--acc-soft2),var(--acc-soft));
  box-shadow:0 2px 0 0 var(--acc-dd),0 0 30px -8px var(--acc-glow)}
.o-d{font-size:12.5px;color:var(--muted);font-weight:400}
.o-k{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:6px;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;line-height:1;color:transparent;transition:background .2s}
.opt[aria-pressed="true"] .o-k{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.opt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.rng{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.rng output{font-family:var(--f-display);font-size:26px;color:var(--acc);min-width:6ch;text-align:right;font-variant-numeric:tabular-nums}
.rng output small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--acc) var(--p,30%),#141c32 var(--p,30%));border:1px solid var(--line);box-shadow:inset 0 2px 0 rgba(0,0,0,.4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:7px;background:linear-gradient(180deg,#fff,#cfd8f0);border:0;box-shadow:0 4px 0 #6b7696,0 0 0 4px var(--acc-soft),0 8px 16px rgba(0,0,0,.6);cursor:grab}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:7px;background:#e9eeff;border:0;box-shadow:0 4px 0 #6b7696,0 0 0 4px var(--acc-soft);cursor:grab}
.rng-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);font-family:var(--f-mono);grid-column:1/-1;margin-top:-8px}
.sugs{display:flex;flex-wrap:wrap;gap:8px}
.sug{font-size:12.5px;padding:7px 11px;border-radius:8px;border:1px dashed var(--line2);background:transparent;color:var(--muted);cursor:pointer;transition:color .2s,border-color .2s}
.sug:hover{color:var(--fg);border-color:var(--acc)}
.sug::before{content:"+ ";color:var(--acc)}
.err{margin-top:20px;font-size:13.5px;color:#FF8A96;padding:10px 14px;border-radius:10px;background:rgba(255,107,122,.08);border:1px solid rgba(255,107,122,.3)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px;padding-top:24px;border-top:1px dashed var(--line2);flex-wrap:wrap}
.nav .cnt{font-family:var(--f-mono);font-size:12px;color:var(--dim)}

/* engine */
.think{display:grid;place-items:center;padding-block:60px;scroll-margin-top:80px}
.think-box{width:min(100%,640px);text-align:left}
.think-box h2{font-size:clamp(24px,3.4vw,36px);margin-top:12px}
.log{list-style:none;margin:24px 0 0;padding:18px;border-radius:14px;background:rgba(3,5,10,.85);border:1px solid var(--line);font-size:12.5px;line-height:1.9;min-height:220px;color:var(--muted);overflow:hidden}
.log li{display:flex;gap:10px;animation:in .3s ease-out}
.log li b{color:var(--acc);font-weight:400}
.log li.ok b{color:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.bar{height:6px;border-radius:4px;background:#121a2e;margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 16px var(--acc-glow);transition:width .4s}

/* result */
.result{padding-top:36px;display:grid;gap:22px;scroll-margin-top:72px}
.r-head{position:relative;overflow:hidden}
.r-head .eyebrow{justify-content:space-between;flex-wrap:wrap}
.r-for{color:var(--muted);margin-top:18px;font-size:14px}
.r-for b{color:var(--fg)}
.r-title{font-size:clamp(28px,4vw,46px);margin-top:8px}
.r-title em{font-style:normal;color:var(--acc)}
.r-sum{color:var(--muted);max-width:70ch;margin-top:14px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:26px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{padding:16px;border-radius:14px;background:rgba(4,7,14,.6);border:1px solid var(--line);box-shadow:0 5px 0 0 var(--cap);min-width:0}
.tile span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.tile b{display:block;font-family:var(--f-display);font-size:clamp(20px,2.4vw,28px);margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.sec-h{display:grid;gap:6px;margin-bottom:20px}
.sec-h h3{font-size:clamp(20px,2.4vw,27px)}
.sec-h p:not(.eyebrow){color:var(--muted);font-size:14px;max-width:70ch}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media(min-width:900px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.why{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.why li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:start;color:var(--muted);font-size:14.5px}
.why li b{color:var(--fg);font-weight:600}
.why .k{height:26px;padding:0 8px;border-radius:7px;display:grid;place-items:center;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;background:var(--acc-soft);color:var(--acc);font-family:var(--f-mono);font-size:12px;border:1px solid var(--line2)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checks li{position:relative;padding-left:30px;font-size:14.5px;color:var(--fg)}
.checks li::before{content:"";position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:5px;background:var(--acc-soft2);border:1px solid var(--acc)}
.checks li::after{content:"";position:absolute;left:6px;top:7px;width:6px;height:9px;border:solid var(--acc);border-width:0 2px 2px 0;transform:rotate(45deg)}
.checks li small{display:block;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;padding:7px 12px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--fg);box-shadow:0 3px 0 0 var(--cap)}
.chip.acc{border-color:var(--acc);color:var(--acc)}
.note{font-size:12.5px;color:var(--dim);margin-top:14px}

/* timeline (course) */
.days{display:grid;gap:18px}
.day{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:820px){.day{grid-template-columns:150px minmax(0,1fr);gap:22px}}
.day-l{display:flex;flex-direction:column;gap:2px}
@media(min-width:820px){.day-l{position:sticky;top:90px;align-self:start}}
.day-l b{font-family:var(--f-display);font-size:24px;color:var(--acc)}
.day-l span{font-size:12.5px;color:var(--muted)}
.sess{display:grid;gap:12px}
.ses{border-radius:14px;border:1px solid var(--line);background:rgba(4,7,14,.55);overflow:hidden}
.ses-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
.mod{padding:16px;display:grid;gap:8px}
.mod+.mod{border-top:1px dashed var(--line)}
.mod h4{font-size:17px}
.mod ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:grid;gap:3px}
.lab{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--acc-soft);border:1px solid var(--line2);color:var(--fg)}
.lab .mono{font-size:10.5px;letter-spacing:.12em;color:var(--acc);padding-top:2px;flex:none}

/* services (automation) */
.svcs{display:grid;gap:18px}
.svc{display:grid;gap:16px;border-radius:16px;border:1px solid var(--line);background:rgba(4,7,14,.55);padding:clamp(16px,2.6vw,26px);box-shadow:0 6px 0 0 var(--cap)}
.svc-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.svc-h h4{font-size:clamp(19px,2.2vw,24px)}
.svc-h p{color:var(--muted);font-size:14px;margin-top:6px;max-width:68ch}
.prio{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;padding:6px 10px;border-radius:7px;border:1px solid var(--acc);color:var(--acc);white-space:nowrap}
.prio.p2{border-color:var(--acc2);color:var(--acc2)}
.prio.p3{border-color:var(--line2);color:var(--muted)}
.flow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media(min-width:820px){.flow{grid-template-columns:repeat(4,minmax(0,1fr));gap:0}}
.fs{position:relative;padding:12px 14px;border-radius:10px;background:linear-gradient(180deg,rgba(32,43,72,.7),rgba(15,21,38,.85));border:1px solid var(--line2);font-size:13px;box-shadow:0 4px 0 0 var(--cap);min-width:0}
.fs span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--acc);margin-bottom:4px}
@media(min-width:820px){.fs{margin-right:22px}.fs:last-child{margin-right:0}.fs:not(:last-child)::after{content:"";position:absolute;right:-17px;top:50%;width:12px;height:12px;border:solid var(--acc);border-width:2px 2px 0 0;transform:translateY(-50%) rotate(45deg)}}
.svc-b{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:820px){.svc-b{grid-template-columns:repeat(3,minmax(0,1fr))}}
.svc-b h5{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);margin:0 0 8px;font-weight:400;text-transform:uppercase}
.svc-b ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted);display:grid;gap:3px}
.svc-b p{font-size:13.5px;color:var(--fg)}
.fit{font-size:13.5px;color:var(--muted);padding:10px 12px;border-left:2px solid var(--acc);background:var(--acc-soft);border-radius:0 8px 8px 0}
.fit b{color:var(--fg)}

.arch{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;perspective:1600px}
@media(min-width:900px){.arch{grid-template-columns:1fr 1.4fr 1fr 1fr;align-items:stretch}}
.lane{border-radius:14px;padding:14px;border:1px solid var(--line);background:rgba(4,7,14,.55);display:flex;flex-direction:column;gap:8px;min-width:0}
.lane.core{border-color:var(--acc);background:linear-gradient(180deg,var(--acc-soft2),rgba(4,7,14,.6));box-shadow:0 0 50px -20px var(--acc-glow)}
.lane h5{margin:0 0 4px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);font-weight:400}
.lane.core h5{color:var(--acc)}
.node{font-size:13px;padding:9px 11px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--line2);box-shadow:0 3px 0 0 var(--cap)}
.lane.core .node{background:rgba(5,8,16,.7)}

.phases{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:860px){.phases{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ph{border-radius:14px;padding:18px;border:1px solid var(--line);background:rgba(4,7,14,.55);display:grid;gap:10px;align-content:start;position:relative}
.ph .mono{font-size:10.5px;letter-spacing:.14em;color:var(--acc)}
.ph h4{font-size:18px}
.ph ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted);display:grid;gap:3px}
.ph .tl{font-size:12px;color:var(--dim)}

.howto{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;counter-reset:s}
@media(min-width:760px){.howto{grid-template-columns:repeat(4,minmax(0,1fr))}}
.howto li{counter-increment:s;padding:16px;border-radius:12px;border:1px solid var(--line);background:rgba(4,7,14,.5);font-size:13.5px;color:var(--muted);display:grid;gap:6px;align-content:start}
.howto li::before{content:counter(s,decimal-leading-zero);font-family:var(--f-mono);font-size:12px;color:var(--acc)}
.howto b{color:var(--fg);font-size:15px}
.quote{font-size:14.5px;color:var(--fg);padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.03);border:1px dashed var(--line2)}
.quote span{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);margin-bottom:6px}

/* cta */
.cta{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;border-color:var(--acc);
  background:radial-gradient(80% 120% at 100% 0%,var(--acc-soft2),transparent 60%),var(--panel)}
@media(min-width:900px){.cta{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:center}}
.cta h2{font-size:clamp(26px,3.6vw,40px);margin-top:12px}
.cta-l>p{color:var(--muted);margin-top:12px;max-width:58ch}
.cta-steps{margin:18px 0 0;padding-left:20px;color:var(--muted);font-size:14px;display:grid;gap:4px}
.cta-steps b{color:var(--fg)}
.cta-r{display:grid;gap:12px}
.idbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.idbox div{padding:12px 14px;border-radius:12px;background:rgba(4,7,14,.7);border:1px solid var(--line2);min-width:0}
.idbox span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--dim)}
.idbox b{display:block;font-family:var(--f-display);font-size:20px;color:var(--fg);margin-top:2px;user-select:all;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idbox .z b{color:var(--acc)}
.copied{font-size:12.5px;color:var(--ok);min-height:1.2em}
#sumtxt{width:100%;min-height:140px;font:12.5px/1.5 var(--f-mono);background:rgba(4,7,14,.8);color:var(--fg);border:1px solid var(--line2);border-radius:10px;padding:12px}

.foot{position:relative;z-index:2;border-top:1px solid var(--line);padding:22px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto;color:var(--dim);font-size:12.5px}
.foot b{color:var(--muted)}
@media(min-width:720px){.foot{padding:22px 28px}}

.reveal{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(14px);opacity:.001}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

:root{--acc:#FFB547;--acc-d:#F08C1E;--acc-dd:#7E4507;--acc-ink:#1C0F00;--acc-glow:rgba(255,181,71,.45);--acc-soft:rgba(255,181,71,.08);--acc-soft2:rgba(255,181,71,.18);--acc2:#5B8CFF;--acc2-soft:rgba(91,140,255,.18);}

    if (A.budget === 'l') add('agent', 3, 'định hướng chuyển đổi toàn diện');

/* Drabuff AI — interactive voxel field + assembling AI core (Three.js r128) */
(function () {
  var api = { setProgress: function () {}, setMode: function () {} };
  window.Scene3D = api;
  var cv = document.getElementById('bg3d');
  if (!window.THREE || !cv) { document.documentElement.classList.add('no3d'); return; }
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
  } catch (e) { document.documentElement.classList.add('no3d'); cv.style.display = 'none'; return; }

  var css = getComputedStyle(document.documentElement);
  var ACC = new THREE.Color((css.getPropertyValue('--acc') || '#45E3FF').trim());
  var ACC2 = new THREE.Color((css.getPropertyValue('--acc2') || '#9B8CFF').trim());
  var BG = new THREE.Color('#05070D');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var small = Math.min(innerWidth, innerHeight) < 700;

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, small ? 1.5 : 1.75));
  renderer.setClearColor(BG, 1);
  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(BG, 20, 56);
  var cam = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

  scene.add(new THREE.AmbientLight(0x5a6aa0, 0.6));
  var key = new THREE.DirectionalLight(0xffffff, 0.65); key.position.set(-12, 22, 14); scene.add(key);
  var glow = new THREE.PointLight(ACC, 2.4, 22, 2); scene.add(glow);
  var rim = new THREE.PointLight(ACC2, 2.2, 46, 2); rim.position.set(12, 10, -12); scene.add(rim);

  /* ---- voxel floor ---- */
  var COLS = small ? 20 : 38, ROWS = small ? 22 : 24, SP = 1.1;
  var geo = new THREE.BoxGeometry(0.94, 1, 0.94); geo.translate(0, 0.5, 0);
  var mat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.4, roughness: 0.38 });
  var N = COLS * ROWS;
  var floor = new THREE.InstancedMesh(geo, mat, N);
  floor.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  var base = new THREE.Color('#0D1426'), hot = new THREE.Color(), tmp = new THREE.Color();
  var dummy = new THREE.Object3D();
  var X = new Float32Array(N), Z = new Float32Array(N), R = new Float32Array(N);
  for (var r = 0, i = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++, i++) {
    X[i] = (c - (COLS - 1) / 2) * SP; Z[i] = (r - (ROWS - 1) / 2) * SP - 4; R[i] = Math.random();
    floor.setColorAt(i, base);
  }
  scene.add(floor);

  /* ---- AI core: 3x3x3 blocks ---- */
  var core = new THREE.Group(); scene.add(core);
  var cubes = [];
  var cgeo = new THREE.BoxGeometry(0.86, 0.86, 0.86);
  var egeo = new THREE.EdgesGeometry(cgeo);
  for (var a = -1; a <= 1; a++) for (var b = -1; b <= 1; b++) for (var d = -1; d <= 1; d++) {
    var m = new THREE.MeshStandardMaterial({ color: 0x121a30, metalness: 0.55, roughness: 0.3, emissive: 0x000000 });
    var mesh = new THREE.Mesh(cgeo, m);
    var edge = new THREE.LineSegments(egeo, new THREE.LineBasicMaterial({ color: ACC, transparent: true, opacity: 0.35 }));
    mesh.add(edge);
    mesh.userData = { home: new THREE.Vector3(a, b, d), seed: Math.random(), lit: 0, edge: edge };
    core.add(mesh); cubes.push(mesh);
  }
  cubes.sort(function (p, q) { return p.userData.seed - q.userData.seed; });

  var state = { mode: 'idle', progress: 0.15, explode: 0.35, spin: 0.25 };
  api.setProgress = function (p) { state.progress = Math.max(0, Math.min(1, p)); };
  api.setMode = function (m) { state.mode = m; if (m === 'done') state.progress = 1; };

  /* ---- pointer ---- */
  var ndc = new THREE.Vector2(0, 0), hasPtr = false;
  var ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  var hit = new THREE.Vector3(), target = new THREE.Vector3(0, 0, 0), ptr = new THREE.Vector3(0, 0, 0);
  window.addEventListener('pointermove', function (e) {
    ndc.x = (e.clientX / innerWidth) * 2 - 1; ndc.y = -(e.clientY / innerHeight) * 2 + 1; hasPtr = true;
  }, { passive: true });
  var burst = 0;
  window.addEventListener('pointerdown', function () { burst = 1; }, { passive: true });

  function resize() {
    var w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); cam.aspect = w / h;
    cam.fov = w < 700 ? 58 : 42; cam.updateProjectionMatrix();
    core.position.set(w < 980 ? 0 : 6.5, 5.2, -6);
  }
  resize(); window.addEventListener('resize', resize);

  var clock = 0, last = performance.now(), running = true;
  document.addEventListener('visibilitychange', function () { running = !document.hidden; if (running) { last = performance.now(); requestAnimationFrame(frame); } });

  function frame(now) {
    if (!running) return;
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    clock += dt * (reduce ? 0.2 : 1);
    var t = clock, thinking = state.mode === 'thinking', done = state.mode === 'done';

    // camera with scroll + pointer parallax
    var sy = Math.min(1, (window.scrollY || 0) / 900);
    cam.position.x += ((ndc.x * 1.6) - cam.position.x) * 0.04;
    cam.position.y += ((13 - sy * 3.5 + ndc.y * 0.8) - cam.position.y) * 0.05;
    cam.position.z = 22;
    cam.lookAt(0, 1.5 - sy * 2, -6);

    // pointer target on floor
    if (hasPtr) {
      ray.setFromCamera(ndc, cam);
      if (ray.ray.intersectPlane(plane, hit)) target.copy(hit);
    } else {
      target.set(Math.sin(t * 0.35) * 10, 0, Math.cos(t * 0.27) * 5 - 4);
    }
    ptr.lerp(target, 0.12);
    glow.position.set(ptr.x, 3.2, ptr.z);
    burst *= 0.94;

    var speed = thinking ? 3.2 : 1;
    for (var i = 0; i < N; i++) {
      var dx = X[i] - ptr.x, dz = Z[i] - ptr.z, d2 = dx * dx + dz * dz;
      var bump = Math.exp(-d2 / 9);
      var ring = burst > 0.02 ? Math.exp(-Math.pow(Math.sqrt(d2) - (1 - burst) * 16, 2) / 3) * burst : 0;
      var wave = 0.35 + 0.28 * Math.sin(X[i] * 0.33 + t * 1.1 * speed) + 0.22 * Math.cos(Z[i] * 0.41 + t * 0.8 * speed);
      var h = Math.max(0.12, wave + bump * 3.4 + ring * 2.2 + (thinking ? 0.9 * Math.max(0, Math.sin(t * 7 + R[i] * 12)) * R[i] : 0));
      dummy.position.set(X[i], -1.4, Z[i]); dummy.scale.set(1, h, 1); dummy.updateMatrix();
      floor.setMatrixAt(i, dummy.matrix);
      var heat = Math.min(1, bump * 0.95 + ring * 0.8 + (thinking ? R[i] * 0.25 * Math.max(0, Math.sin(t * 5 + R[i] * 9)) : 0));
      hot.copy(ACC).lerp(ACC2, Math.max(0, Math.min(1, (X[i] + 20) / 40)));
      tmp.copy(base).lerp(hot, heat);
      floor.setColorAt(i, tmp);
    }
    floor.instanceMatrix.needsUpdate = true;
    if (floor.instanceColor) floor.instanceColor.needsUpdate = true;

    // core
    var exT = thinking ? 0.55 + 0.45 * Math.sin(t * 4) : done ? 0.06 : 0.3 + 0.08 * Math.sin(t * 1.2);
    state.explode += (exT - state.explode) * 0.08;
    var spT = thinking ? 2.4 : done ? 0.45 : 0.22;
    state.spin += (spT - state.spin) * 0.05;
    core.rotation.y += dt * state.spin * (reduce ? 0.2 : 1);
    core.rotation.x = 0.45 + Math.sin(t * 0.4) * 0.12 + ndc.y * 0.15;
    core.rotation.z = 0.2 + ndc.x * 0.12;
    core.position.y = 5.2 + Math.sin(t * 0.9) * 0.35;
    var litN = Math.round(state.progress * cubes.length);
    for (var k = 0; k < cubes.length; k++) {
      var cu = cubes[k], u = cu.userData, s = 1 + state.explode;
      cu.position.set(u.home.x * s, u.home.y * s, u.home.z * s);
      var want = k < litN ? 1 : (thinking && Math.sin(t * 9 + u.seed * 30) > 0.6 ? 0.6 : 0);
      u.lit += (want - u.lit) * 0.1;
      cu.material.emissive.copy(ACC).multiplyScalar(u.lit * 0.85);
      u.edge.material.opacity = 0.25 + u.lit * 0.6;
      cu.rotation.set(0, 0, 0);
      if (thinking) cu.rotation.y = Math.sin(t * 3 + u.seed * 6) * 0.5;
    }

    renderer.render(scene, cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

    '<section class="wiz" id="wiz" hidden>' +
      '<aside class="rail" aria-label="Tiến trình"><p class="rail-h">TIẾN TRÌNH · ' + steps.length + ' KHỐI</p><ol class="stack">' +
        steps.map(function (s, i) { return '<li data-i="' + i + '"><span class="blk"></span><span class="t">' + s.title + '</span></li>'; }).join('') +
      '</ol></aside>' +
      '<div class="panel">' +
        '<div class="panel-h"><span class="step-no mono"></span><h2 class="step-title"></h2><p class="step-sub"></p></div>' +
        '<div class="qs"></div>' +
        '<p class="err" role="alert" hidden></p>' +
        '<div class="nav"><button class="btn ghost" id="back" type="button">← Quay lại</button><span class="cnt"></span><button class="btn primary" id="next" type="button">Tiếp tục <span class="arr">→</span></button></div>' +
      '</div>' +
    '</section>' +
    '<section class="think" id="think" hidden><div class="think-box">' +
      '<p class="eyebrow"><span class="dot"></span>DRABUFF AI ENGINE · ĐANG XỬ LÝ</p>' +
      '<h2>' + P.thinkTitle + '</h2><ul class="log mono" id="log"></ul><div class="bar"><i id="bar"></i></div>' +
    '</div></section>' +
    '<section class="result" id="result" hidden></section>';

  /* ---------- questions ---------- */
  function val(q) { return A[q.id]; }
  function qHTML(q) {
    var v = val(q);
    var lab = q.type === 'text' || q.type === 'tel' || q.type === 'textarea' || q.type === 'range'
      ? '<label class="q-l" for="q_' + q.id + '">' + q.label + (q.req ? '<i>*</i>' : '') + '</label>'
      : '<span class="q-l" id="ql_' + q.id + '">' + q.label + (q.req ? '<i>*</i>' : '') + '</span>';
    var tag = q.type === 'multi' ? '<span class="q-tag">Chọn nhiều' + (q.max ? ' · tối đa ' + q.max : '') + '</span>' : q.type === 'single' ? '<span class="q-tag">Chọn 1</span>' : '';
    var head = '<div class="q-h">' + tag + lab + (q.help ? '<p class="q-help">' + q.help + '</p>' : '') + '</div>';
    var cls = 'q' + (q.half ? ' half' : '');
    if (q.type === 'text' || q.type === 'tel') {
      return '<div class="' + cls + '" data-q="' + q.id + '">' + head + '<input class="inp" id="q_' + q.id + '" type="' + q.type + '"' +
        (q.type === 'tel' ? ' inputmode="tel" autocomplete="tel"' : ' autocomplete="' + (q.ac || 'off') + '"') +
        ' placeholder="' + esc(q.ph || '') + '" value="' + esc(v || '') + '" maxlength="120"></div>';
    }
    if (q.type === 'textarea') {
      return '<div class="' + cls + '" data-q="' + q.id + '">' + head + '<textarea class="ta" id="q_' + q.id + '" placeholder="' + esc(q.ph || '') + '" maxlength="600">' + esc(v || '') + '</textarea>' +
        (q.sugs ? '<div class="sugs">' + q.sugs.map(function (s) { return '<button type="button" class="sug" data-s="' + esc(s) + '">' + esc(s) + '</button>'; }).join('') + '</div>' : '') + '</div>';
    }
    if (q.type === 'range') {
      if (v == null) { v = q.def; A[q.id] = v; }
      return '<div class="' + cls + '" data-q="' + q.id + '">' + head + '<div class="rng"><input type="range" id="q_' + q.id + '" min="' + q.min + '" max="' + q.max + '" step="' + q.step + '" value="' + v + '">' +
        '<output class="mono" for="q_' + q.id + '">' + fmtR(q, v) + '</output><div class="rng-l"><span>' + q.min + '</span><span>' + q.max + (q.plus ? '+' : '') + '</span></div></div></div>';
    }
    // single / multi
    return '<div class="' + cls + '" data-q="' + q.id + '" role="group" aria-labelledby="ql_' + q.id + '">' + head +
      '<div class="opts' + (q.wide ? ' wide' : '') + '">' + q.options.map(function (o) {
        var on = q.type === 'single' ? v === o.v : (v || []).indexOf(o.v) > -1;
        return '<button type="button" class="opt" data-v="' + o.v + '" aria-pressed="' + on + '"><span class="o-l">' + o.label + '</span>' +
          (o.desc ? '<span class="o-d">' + o.desc + '</span>' : '') + '<span class="o-k" aria-hidden="true">' + (q.type === 'multi' ? '✓' : '●') + '</span></button>';
      }).join('') + '</div></div>';
  }
  function fmtR(q, v) { return (Number(v) >= q.max && q.plus ? q.max + '+' : Number(v).toLocaleString('vi-VN')) + '<small>' + (q.unit || '') + '</small>'; }
  function qById(id) { var s = steps[step]; for (var i = 0; i < s.qs.length; i++) if (s.qs[i].id === id) return s.qs[i]; }
  function rangeFill(inp) { var p = (inp.value - inp.min) / (inp.max - inp.min) * 100; inp.style.setProperty('--p', p + '%'); }

  function renderStep() {
    var s = steps[step];
    $('.step-no').textContent = 'KHỐI ' + String(step + 1).padStart(2, '0') + ' / ' + String(steps.length).padStart(2, '0');
    $('.step-title').innerHTML = s.title;
    $('.step-sub').innerHTML = s.sub || '';
    $('.qs').innerHTML = s.qs.map(qHTML).join('');
    $$('.qs input[type=range]').forEach(rangeFill);
    $('.err').hidden = true;
    $('#back').style.visibility = step === 0 ? 'hidden' : 'visible';
    $('#next').innerHTML = step === steps.length - 1 ? P.finishLabel + ' <span class="arr">→</span>' : 'Tiếp tục <span class="arr">→</span>';
    $$('.stack li').forEach(function (li, i) { li.className = i < step ? 'done' : i === step ? 'cur' : ''; });
    $('.cnt').textContent = s.qs.length + ' câu hỏi';
    window.Scene3D.setProgress(0.12 + step / steps.length * 0.7);
  }

  var qsEl = $('.qs');
  qsEl.addEventListener('click', function (e) {
    var sug = e.target.closest('.sug');
    if (sug) {
      var qd = sug.closest('.q'), ta = $('textarea', qd), cur = ta.value.trim();
      ta.value = cur ? cur.replace(/[.;,\s]*$/, '') + '; ' + sug.dataset.s : sug.dataset.s;
      A[qd.dataset.q] = ta.value; save(); ta.focus(); return;
    }
    var b = e.target.closest('.opt'); if (!b) return;
    var qe = b.closest('.q'), q = qById(qe.dataset.q), v = b.dataset.v;
    qe.classList.remove('bad');
    if (q.type === 'single') {
      A[q.id] = v; $$('.opt', qe).forEach(function (o) { o.setAttribute('aria-pressed', o === b); });
    } else {
      var arr = (A[q.id] || []).slice(), ix = arr.indexOf(v);
      if (ix > -1) arr.splice(ix, 1);
      else {
        if (q.max && arr.length >= q.max) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); showErr('Câu này chọn tối đa ' + q.max + ' mục — bỏ bớt 1 mục trước khi chọn mục mới.'); return; }
        if (q.exclusive && q.exclusive.indexOf(v) > -1) arr = [];
        else if (q.exclusive) arr = arr.filter(function (x) { return q.exclusive.indexOf(x) < 0; });
        arr.push(v);
      }
      A[q.id] = arr;
      $$('.opt', qe).forEach(function (o) { o.setAttribute('aria-pressed', arr.indexOf(o.dataset.v) > -1); });
    }
    save();
  });
  qsEl.addEventListener('input', function (e) {
    var qe = e.target.closest('.q'); if (!qe) return;
    var q = qById(qe.dataset.q); qe.classList.remove('bad');
    if (q.type === 'range') { A[q.id] = Number(e.target.value); $('output', qe).innerHTML = fmtR(q, e.target.value); rangeFill(e.target); }
    else A[q.id] = e.target.value;
    save();
  });

  function showErr(m) { var e = $('.err'); e.textContent = m; e.hidden = false; }
  function validPhone(s) { var d = String(s || '').replace(/[\s.\-()]/g, '').replace(/^\+?84/, '0'); return /^0[35789]\d{8}$/.test(d); }
  function validate() {
    var s = steps[step], bad = [];
    s.qs.forEach(function (q) {
      var v = A[q.id], ok = true;
      if (q.req) ok = Array.isArray(v) ? v.length > 0 : v != null && String(v).trim() !== '';
      if (ok && q.type === 'tel' && v) ok = validPhone(v);
      if (!ok) { bad.push(q); $('[data-q="' + q.id + '"]').classList.add('bad'); }
    });
    if (bad.length) {
      var q = bad[0];
      showErr(q.type === 'tel' && A[q.id] ? 'Số Zalo chưa đúng định dạng. Nhập 10 số, ví dụ 0912 345 678.' : 'Vui lòng hoàn thành: ' + q.label.replace(/<[^>]+>/g, '') + '.');
      var el = $('[data-q="' + q.id + '"] input, [data-q="' + q.id + '"] textarea, [data-q="' + q.id + '"] .opt'); if (el) el.focus();
      return false;
    }
    return true;
  }

  function go(id) { var el = document.getElementById(id); el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }

  $('#start').addEventListener('click', function () {
    $('#wiz').hidden = false; $('#result').hidden = true; $('#think').hidden = true;
    step = 0; renderStep(); window.Scene3D.setMode('idle'); go('wiz');
  });
  $('#back').addEventListener('click', function () { if (step > 0) { step--; renderStep(); go('wiz'); } });
  $('#next').addEventListener('click', function () {
    if (!validate()) return;
    if (step < steps.length - 1) { step++; renderStep(); go('wiz'); }
    else run();
  });

  /* ---------- engine ---------- */
  function run() {
    $$('.stack li').forEach(function (li) { li.className = 'done'; });
    $('#wiz').hidden = true; var th = $('#think'); th.hidden = false; go('think');
    window.Scene3D.setMode('thinking');
    var lines = P.logs(A), log = $('#log'), bar = $('#bar'), i = 0; log.innerHTML = ''; bar.style.width = '0';
    var tick = function () {
      if (i < lines.length) {
        var li = document.createElement('li'); if (i === lines.length - 1) li.className = 'ok';
        li.innerHTML = '<b>' + (i === lines.length - 1 ? '[OK]' : '[' + String(i + 1).padStart(2, '0') + ']') + '</b><span>' + lines[i] + '</span>';
        log.appendChild(li); i++; bar.style.width = (i / lines.length * 100) + '%';
        setTimeout(tick, reduce ? 120 : 420 + Math.random() * 260);
      } else setTimeout(show, 500);
    };
    tick();
  }

  function code(prefix) {
    var s = (A.company || '') + (A.zalo || '') + (A.industry || ''), h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return prefix + '-' + h.toString(36).toUpperCase().slice(-4).padStart(4, '0');
  }

  function show() {
    var R = P.generate(A, code(P.codePrefix));
    var zDigits = C.zalo.replace(/\D/g, '');
    var res = $('#result');
    res.innerHTML = R.html +
      '<section class="panel cta reveal" id="contact"><div class="cta-l">' +
        '<p class="eyebrow"><span class="dot"></span>BƯỚC TIẾP THEO</p>' +
        '<h2>' + P.cta.title + '</h2><p>' + P.cta.text + '</p>' +
        '<ol class="cta-steps"><li>Bấm <b>Sao chép đề xuất</b> để lưu bản tóm tắt.</li><li>Nhắn Zalo <b>' + C.display + '</b>, dán bản tóm tắt kèm mã <b>' + R.code + '</b>.</li><li>Chuyên gia ' + C.brand + ' liên hệ lại để ' + P.cta.next + '.</li></ol>' +
      '</div><div class="cta-r">' +
        '<div class="idbox"><div><span>MÃ ĐỀ XUẤT</span><b>' + R.code + '</b></div><div class="z"><span>ZALO ' + C.brand.toUpperCase() + '</span><b>' + C.display + '</b></div></div>' +
        '<a class="btn primary" href="https://zalo.me/' + zDigits + '" target="_blank" rel="noopener">Nhắn Zalo cho ' + C.brand + ' <span class="arr">→</span></a>' +
        '<button class="btn ghost" id="copy" type="button">Sao chép đề xuất</button>' +
        '<p class="copied" id="copied" aria-live="polite"></p>' +
        '<textarea id="sumtxt" readonly hidden></textarea>' +
        '<button class="btn link" id="redo" type="button">Làm lại khảo sát</button>' +
      '</div></section>';
    $('#think').hidden = true; res.hidden = false;
    window.Scene3D.setMode('done');
    go('result');
    $('#sumtxt').value = R.summary;
    $('#copy').addEventListener('click', function () {
      var t = R.summary, ok = function () { $('#copied').textContent = 'Đã sao chép. Mở Zalo và dán vào tin nhắn gửi ' + C.brand + '.'; };
      var fb = function () { var ta = $('#sumtxt'); ta.hidden = false; ta.focus(); ta.select(); $('#copied').textContent = 'Trình duyệt chặn sao chép tự động — bản tóm tắt đã được bôi đen, nhấn Ctrl/⌘ + C.'; };
      try { navigator.clipboard.writeText(t).then(ok, fb); } catch (e) { fb(); }
    });
    $('#redo').addEventListener('click', function () { $('#start').click(); });
    if (C.webhook) {
      try { fetch(C.webhook, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ page: P.id, code: R.code, at: new Date().toISOString(), answers: A, summary: R.summary }) }).catch(function () {}); } catch (e) {}
    }
    bindTilt();
  }

  /* ---------- 3D tilt ---------- */
  function bindTilt() {
    if (reduce || !(window.matchMedia && matchMedia('(pointer:fine)').matches)) return;
    $$('[data-tilt]').forEach(function (el) {
      if (el._t) return; el._t = 1;
      var host = el.parentElement;
      host.addEventListener('pointermove', function (e) {
        var r = host.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
        el.style.setProperty('--ry', (x * 26 - 6) + 'deg'); el.style.setProperty('--rx', (-y * 20 + 4) + 'deg');
      });
      host.addEventListener('pointerleave', function () { el.style.removeProperty('--ry'); el.style.removeProperty('--rx'); });
    });
  }
  bindTilt();
})();

</script>
</body>
</html>
